<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#0a0b0f; --bg2:#10121a; --card:#151822; --line:#242838;
  --lime:#c6ff3d; --orange:#ff5a1f; --blue:#3da5ff;
  --text:#f4f5f7; --muted:#8b90a0; --danger:#ff4d5e;
  --display:'Barlow Condensed',Impact,sans-serif; --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
input,textarea,select{font-family:inherit}
.container{max-width:1200px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left))}
.logo-mark{width:34px;height:34px;flex:none;display:block;filter:drop-shadow(0 0 10px rgba(198,255,61,.25))}
a.logo:hover .logo-mark{animation:wiggle .6s}
.logo-lg .logo-mark{width:44px;height:44px}
@keyframes wiggle{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg) scale(1.08)}60%{transform:rotate(6deg)}}
.splash{display:flex;flex-direction:column;align-items:center;gap:18px}
.splash svg{width:84px;height:84px;animation:pulseLogo 1.4s ease-in-out infinite}
@keyframes pulseLogo{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
.nav{padding-top:env(safe-area-inset-top)}
.footer{padding-bottom:calc(36px + env(safe-area-inset-bottom))}
.footer .logo-mark{margin:0 auto 10px}
.toast{bottom:calc(24px + env(safe-area-inset-bottom));max-width:calc(100% - 32px);text-align:center}
.ad-pop{bottom:calc(18px + env(safe-area-inset-bottom))}
.btn,.tab,.pill-tabs button,.seg button{min-height:40px}
.hero{min-height:calc(100vh - 64px);min-height:calc(100dvh - 64px)}
.overlay{padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
.modal{max-height:92vh;max-height:92dvh}
img,video,iframe{max-width:100%}
@media(min-width:1500px){.container{max-width:1360px}html{font-size:17px}}
@media(max-width:900px) and (min-width:601px){.hero{min-height:auto;padding:48px 0}.hero p.lead{font-size:17px}.ncard{width:280px}}
@media(max-width:600px){
  .nav-in{height:58px;gap:8px}
  .logo{font-size:22px;gap:6px}.logo-mark{width:30px;height:30px}
  .nav-actions{gap:6px}
  .nav-actions .btn-sm{padding:8px 12px}
  .cart-btn{width:34px;height:34px;font-size:15px}
  .hero{padding:36px 0 48px}
  .hero-cta .btn{flex:1 1 100%}
  .chips .chip{flex:1 1 calc(50% - 10px)}
  section.block{padding:40px 0}
  .modal{padding:22px 18px;border-radius:20px}
  .modal h2{font-size:32px}
  .form-row{grid-template-columns:1fr}
  .p-stats{gap:16px}
  .profile-head .avatar{width:72px;height:72px}
  .ghero{height:200px}.ghead{margin-top:-50px}.glogo{width:88px;height:88px;font-size:34px}
  .store-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .grid3{gap:2px}
  .adm-row{flex-wrap:wrap}
  .ncard{width:250px}
}
@media(max-width:380px){.logo span:last-child{display:none}.nav-actions .btn-sm{padding:7px 10px;font-size:12px}}
@media(hover:none){.ncard:hover,.feat:hover,.gcard:hover,.prod:hover,.pod:hover,.mem:hover{transform:none}}
@media(display-mode:standalone){.setup{display:none}}
@media print{.nav,.ticker,.hero-bg,.ad-pop,.toast{display:none!important}body{background:#fff;color:#000}}
.display{font-family:var(--display);font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.5px;line-height:.95}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-lime{background:var(--lime);color:#0a0b0f;box-shadow:0 0 0 0 rgba(198,255,61,.5)}
.btn-lime:hover{box-shadow:0 8px 30px rgba(198,255,61,.35)}
.btn-orange{background:var(--orange);color:#fff}
.btn-orange:hover{box-shadow:0 8px 30px rgba(255,90,31,.4)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--lime);color:var(--lime)}
.btn-google{background:#fff;color:#1f1f1f;width:100%}
.btn-sm{padding:8px 16px;font-size:13px}

/* ---------- navbar ---------- */
.nav{position:sticky;top:0;z-index:50;background:rgba(10,11,15,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo span{color:var(--lime)}
.logo-dot{width:10px;height:10px;border-radius:50%;background:var(--lime);animation:pulse 1.6s infinite}
.nav-actions{display:flex;gap:10px;align-items:center}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{background:var(--lime);color:#0a0b0f}
.show-m{display:none}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--lime),var(--orange));display:grid;place-items:center;font-weight:800;color:#0a0b0f;font-size:14px;object-fit:cover}

/* ---------- hero ---------- */
.hero{position:relative;min-height:calc(100vh - 64px);display:flex;align-items:center;overflow:hidden;padding:60px 0}
.hero-bg{position:absolute;inset:0;overflow:hidden;z-index:0}
.lane{position:absolute;left:-20%;width:140%;height:2px;background:linear-gradient(90deg,transparent,var(--lime),transparent);opacity:.35;transform:rotate(-12deg);animation:laneMove 5s linear infinite}
@keyframes laneMove{from{transform:translateX(-30%) rotate(-12deg)}to{transform:translateX(30%) rotate(-12deg)}}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;animation:float 9s ease-in-out infinite}
.hero .container{width:100%}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(52px,9vw,116px);margin-bottom:22px}
.hero h1 em{color:var(--lime);font-style:italic}
.hero h1 .stroke{-webkit-text-stroke:2px var(--text);color:transparent}
.hero p.lead{color:var(--muted);font-size:18px;max-width:520px;line-height:1.6;margin-bottom:30px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:10px;margin-top:38px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;animation:float 6s ease-in-out infinite}
.chip b{display:block;font-family:var(--display);font-style:italic;font-size:26px;color:var(--lime)}
.chip small{color:var(--muted);font-size:12px}
.chip:nth-child(2){animation-delay:-2s}.chip:nth-child(3){animation-delay:-4s}

/* hero slider */
.hslider{position:relative;aspect-ratio:4/4.6;border-radius:26px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.hslide{position:absolute;inset:0;opacity:0;transform:scale(1.06);transition:opacity .9s,transform 6s linear;display:flex;flex-direction:column;justify-content:flex-end;padding:26px;cursor:pointer}
.hslide.on{opacity:1;transform:scale(1)}
.hslide::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.85));z-index:1}
.hslide>*{position:relative;z-index:2}
.hslide h3{font-size:30px;margin:10px 0 6px}
.hslide p{color:#d3d6e0;font-size:14px;line-height:1.5}
.hdots{position:absolute;top:16px;right:16px;z-index:5;display:flex;gap:6px}
.hdots button{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.4);padding:0;transition:.3s}
.hdots button.on{width:26px;background:var(--lime)}
.tag{display:inline-block;align-self:flex-start;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#0a0b0f}
.tag.running{background:var(--lime)}.tag.triatlon{background:var(--blue)}.tag.eventos{background:var(--orange);color:#fff}
.demo-badge{position:absolute;top:16px;left:16px;z-index:5;background:rgba(0,0,0,.6);border:1px solid var(--line);padding:4px 10px;border-radius:99px;font-size:11px;color:var(--muted)}

/* ---------- ticker ---------- */
.ticker{background:var(--lime);color:#0a0b0f;overflow:hidden;padding:12px 0;transform:skewY(-1.2deg);margin:-14px 0 40px}
.ticker-track{display:flex;gap:48px;width:max-content;animation:marquee 40s linear infinite;font-family:var(--display);font-style:italic;font-weight:800;font-size:22px;text-transform:uppercase}
.ticker-track span::after{content:"  ●";margin-left:48px}

/* ---------- secciones ---------- */
section.block{padding:60px 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px;gap:20px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(34px,5vw,56px)}
.sec-head h2 em{color:var(--lime)}
.sec-head p{color:var(--muted);max-width:420px;font-size:14px}

/* ---------- cascada de noticias ---------- */
.cascade{display:flex;flex-direction:column;gap:14px;margin:0 -20px;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.row{overflow:hidden;padding:18px 0}
.row-track{display:flex;gap:18px;width:max-content;animation:marquee var(--dur,55s) linear infinite}
.row.rev .row-track{animation-direction:reverse}
.row:hover .row-track{animation-play-state:paused}
.row-label{font-family:var(--display);font-style:italic;font-weight:800;font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:0 20px 6px;display:flex;align-items:center;gap:8px}
.row-label i{width:22px;height:2px;background:var(--lime)}
.ncard{width:300px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .3s,border-color .3s,box-shadow .3s}
.ncard:nth-child(3n+1){margin-top:0}.ncard:nth-child(3n+2){margin-top:26px}.ncard:nth-child(3n){margin-top:52px}
.ncard:hover{transform:translateY(-8px) rotate(-.6deg);border-color:var(--lime);box-shadow:0 20px 50px rgba(198,255,61,.12)}
.ncard .media{height:160px;position:relative;background-size:cover;background-position:center;display:grid;place-items:center;font-size:54px}
.ncard .media .tag{position:absolute;top:12px;left:12px}
.ncard .play{position:absolute;right:12px;bottom:12px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.65);display:grid;place-items:center;font-size:14px}
.ncard .txt{padding:16px}
.ncard h4{font-size:17px;line-height:1.25;margin-bottom:8px}
.ncard p{color:var(--muted);font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ncard time{display:block;margin-top:12px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.g-running{background:linear-gradient(135deg,#1c2a0b,#3d5a0c)}
.g-triatlon{background:linear-gradient(135deg,#0b1c2e,#12456d)}
.g-eventos{background:linear-gradient(135deg,#2e1408,#7a2a0c)}

/* ---------- features ---------- */
.feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;position:relative;overflow:hidden;transition:.3s}
.feat:hover{transform:translateY(-6px);border-color:var(--lime)}
.feat .ico{font-size:38px;margin-bottom:14px}
.feat h3{font-size:30px;margin-bottom:10px}
.feat p{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:18px}
.feat .num{position:absolute;right:16px;top:6px;font-family:var(--display);font-style:italic;font-weight:900;font-size:90px;color:rgba(255,255,255,.04)}

/* ---------- reveal ---------- */
.reveal{opacity:0;transform:translateY(34px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:100;display:grid;place-items:center;padding:16px;animation:fade .25s}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:24px;width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:28px;position:relative;animation:pop .3s}
.modal.wide{max-width:680px}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:var(--card);font-size:16px}
.modal h2{font-size:38px;margin-bottom:6px}
.modal .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:99px;padding:4px;margin-bottom:16px}
.seg button{background:none;padding:10px;border-radius:99px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--lime);color:#0a0b0f}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.field input:focus,.field select:focus{border-color:var(--lime)}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:16px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.expand{overflow:hidden;max-height:0;opacity:0;transition:max-height .45s ease,opacity .35s}
.expand.open{max-height:300px;opacity:1}
.partner-box{border:1.5px dashed var(--orange);border-radius:14px;padding:14px;margin-bottom:12px;background:rgba(255,90,31,.06)}
.msg{padding:10px 14px;border-radius:12px;font-size:13px;margin-bottom:12px}
.msg.err{background:rgba(255,77,94,.12);color:var(--danger);border:1px solid rgba(255,77,94,.3)}
.msg.ok{background:rgba(198,255,61,.1);color:var(--lime);border:1px solid rgba(198,255,61,.3)}
.link{background:none;color:var(--lime);font-weight:600;font-size:13px;text-decoration:underline}
.video{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;margin:14px 0}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ---------- shell privado ---------- */
.panel{padding:40px 0 80px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px}
.profile-head{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.profile-head .avatar{width:84px;height:84px;font-size:32px}
.role-pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;background:var(--lime);color:#0a0b0f}
.role-pill.partner{background:var(--orange);color:#fff}.role-pill.admin{background:var(--blue)}
.soon{text-align:center;padding:70px 20px}
.soon .ico{font-size:60px;margin-bottom:14px}
.soon h3{font-size:44px;margin-bottom:10px}
.soon p{color:var(--muted);max-width:440px;margin:0 auto}

.setup{background:rgba(255,90,31,.1);border-bottom:1px solid rgba(255,90,31,.4);color:#ffb08f;padding:8px 20px;font-size:13px;text-align:center}
.footer{border-top:1px solid var(--line);padding:36px 0;color:var(--muted);font-size:13px;text-align:center}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--lime);color:#0a0b0f;padding:12px 22px;border-radius:99px;font-weight:700;font-size:14px;z-index:200;animation:pop .3s}
.center{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:16px}
.spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--lime);border-radius:50%;animation:spin .8s linear infinite}

/* ---------- feed / perfil (bloque 2) ---------- */
.feed{max-width:520px;margin:0 auto}
.feed-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.pill-tabs{display:flex;background:var(--card);border-radius:99px;padding:4px}
.pill-tabs button{background:none;padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700;color:var(--muted)}
.pill-tabs button.on{background:var(--lime);color:#0a0b0f}
.post{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:22px;overflow:hidden;animation:pop .4s}
.post-head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post-head .who{flex:1;cursor:pointer;min-width:0}
.post-head b{display:block;font-size:14px}
.post-head small{color:var(--muted);font-size:12px}
.post-media{background:#000;display:flex;justify-content:center;max-height:640px;position:relative}
.post-media img,.post-media video{width:100%;max-height:640px;object-fit:contain;display:block}
.post-media iframe{width:100%;aspect-ratio:16/10;border:0}
.post-actions{display:flex;gap:16px;padding:12px 14px 4px;font-size:24px}
.post-actions button{background:none;padding:0;font-size:24px;line-height:1;transition:transform .15s}
.post-actions button:hover{transform:scale(1.15)}
.post-actions .liked{animation:heart .35s}
.post-body{padding:4px 14px 14px;font-size:14px;line-height:1.5}
.post-body .ev{display:inline-block;font-size:11px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.comments{border-top:1px solid var(--line);padding:12px 14px}
.comment{font-size:13px;margin-bottom:8px;line-height:1.45}
.comment b{margin-right:6px}
.comment-form{display:flex;gap:8px;margin-top:8px}
.comment-form input{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:9px 14px;color:var(--text);font-size:13px;outline:none}
.p-stats{display:flex;gap:28px;margin:14px 0}
.p-stats div{text-align:center}
.p-stats b{display:block;font-size:20px}
.p-stats small{color:var(--muted);font-size:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:22px}
.grid3 .cell{aspect-ratio:1;background:var(--card) center/cover;cursor:pointer;position:relative;display:grid;place-items:center;font-size:28px;overflow:hidden;transition:.2s}
.grid3 .cell:hover{filter:brightness(1.2);transform:scale(.98)}
.grid3 .cell .vid{position:absolute;top:8px;right:8px;font-size:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.time-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rec{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.rec:last-child{border-bottom:none}
.rec .big{font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;color:var(--lime)}
.rec small{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
/* ---------- ranking y gráficas (bloque 3) ---------- */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;margin:10px 0 26px}
.pod{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;text-align:center;padding:18px 10px 16px;cursor:pointer;transition:.25s;position:relative}
.pod:hover{transform:translateY(-6px)}
.pod .medal{font-size:46px;display:block;margin-bottom:6px;animation:float 4s ease-in-out infinite}
.pod.p1{padding-top:30px;padding-bottom:28px;border-color:#ffd54a;background:linear-gradient(180deg,rgba(255,213,74,.16),var(--card))}
.pod.p1 .medal{font-size:60px}
.pod.p2{border-color:#c0c7d4;background:linear-gradient(180deg,rgba(192,199,212,.12),var(--card))}
.pod.p3{border-color:#cd7f32;background:linear-gradient(180deg,rgba(205,127,50,.14),var(--card))}
.pod .avatar{margin:0 auto 8px}
.pod b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .t{font-family:var(--display);font-style:italic;font-weight:900;font-size:30px;color:var(--lime);margin-top:4px}
.pod small{color:var(--muted);font-size:12px}
.rrow{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;cursor:pointer;transition:.2s}
.rrow:hover{background:var(--bg2)}
.rrow.me{background:rgba(198,255,61,.08);border:1px solid rgba(198,255,61,.35)}
.rrow .pos{width:34px;text-align:center;font-family:var(--display);font-style:italic;font-weight:800;font-size:22px;color:var(--muted)}
.rrow .nm{flex:1;min-width:0}
.rrow .nm b{display:block;font-size:14px}
.rrow .nm small{color:var(--muted);font-size:12px}
.rrow .tm{font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;color:var(--lime)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:22px}
.chart-box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.chart-box h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chart-box select{background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px}
.chart-wrap{position:relative;height:230px}
@media(max-width:600px){.podium{grid-template-columns:1fr;}.pod.p1{order:-1}}
/* ---------- grupos (bloque 4) ---------- */
.gslider{position:relative}
.gtrack{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 4px 22px;scrollbar-width:none}
.gtrack::-webkit-scrollbar{display:none}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;transition:.3s;scroll-snap-align:start}
.gtrack .gcard{flex:none;width:290px}
.gcard:hover{transform:translateY(-8px);border-color:var(--orange);box-shadow:0 20px 50px rgba(255,90,31,.14)}
.gcard .cov{height:128px;background:linear-gradient(135deg,#2e1408,#7a2a0c) center/cover;position:relative}
.gcard .lg{position:absolute;left:16px;bottom:-28px;width:58px;height:58px;border-radius:16px;border:3px solid var(--card);background:var(--bg2) center/cover;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:900;font-size:22px;color:var(--lime)}
.gcard .info{padding:36px 16px 16px}
.gcard h4{font-size:18px;margin-bottom:4px}
.gcard p{color:var(--muted);font-size:13px;line-height:1.45;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard .meta{display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--muted)}
.garrow{position:absolute;top:42%;z-index:3;width:42px;height:42px;border-radius:50%;background:rgba(10,11,15,.85);border:1px solid var(--line);font-size:18px}
.garrow:hover{border-color:var(--lime);color:var(--lime)}
.garrow.l{left:-10px}.garrow.r{right:-10px}
.ghero{height:280px;background:linear-gradient(135deg,#2e1408,#7a2a0c) center/cover;position:relative}
.ghero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--bg))}
.ghead{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap;margin-top:-70px;position:relative;z-index:2;margin-bottom:22px}
.glogo{width:112px;height:112px;border-radius:28px;border:4px solid var(--bg);background:var(--card) center/cover;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:900;font-size:44px;color:var(--lime);flex:none}
.gsec{margin-top:24px}
.ev-item{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;align-items:center}
.ev-date{flex:none;width:58px;text-align:center;background:var(--bg2);border-radius:12px;padding:8px 0}
.ev-date b{display:block;font-family:var(--display);font-style:italic;font-size:26px;color:var(--orange);line-height:1}
.ev-date small{font-size:11px;text-transform:uppercase;color:var(--muted)}
.ev-item h4{font-size:15px;margin-bottom:3px}
.ev-item p{font-size:13px;color:var(--muted)}
.cal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:18px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-head b{text-transform:capitalize}
.cal-head button{background:var(--bg2);width:34px;height:34px;border-radius:50%}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .dow{font-size:11px;color:var(--muted);padding:4px 0;text-transform:uppercase}
.cal-grid .d{aspect-ratio:1;border-radius:10px;background:none;font-size:13px;position:relative;color:var(--text)}
.cal-grid .d:hover{background:var(--bg2)}
.cal-grid .d.ev{background:rgba(255,90,31,.15);font-weight:800}
.cal-grid .d.ev::after{content:"";position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--orange)}
.cal-grid .d.today{outline:1.5px solid var(--lime)}
.cal-grid .d.sel{background:var(--orange);color:#fff}
.gnews{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px;display:flex}
.gnews img{width:150px;object-fit:cover;flex:none}
.gnews div{padding:16px}
.gnews h4{font-size:17px;margin-bottom:6px}
.gnews p{font-size:14px;color:#cfd2dc;line-height:1.55;white-space:pre-line}
.gnews small{color:var(--muted);font-size:11px;display:block;margin-top:8px}
.mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.mem{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 10px;text-align:center;cursor:pointer;transition:.2s}
.mem:hover{border-color:var(--lime);transform:translateY(-4px)}
.mem .avatar{margin:0 auto 8px}
.mem b{display:block;font-size:13px}.mem small{color:var(--muted);font-size:11px}
.adm-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.adm-row small{color:var(--muted);display:block}
.badge-st{font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;text-transform:uppercase}
.badge-st.pending{background:rgba(255,213,74,.18);color:#ffd54a}.badge-st.approved{background:rgba(198,255,61,.15);color:var(--lime)}.badge-st.rejected{background:rgba(255,77,94,.15);color:var(--danger)}
@media(max-width:600px){.gnews{flex-direction:column}.gnews img{width:100%;height:150px}.garrow{display:none}}
/* ---------- tienda, notificaciones, admin (bloque 5) ---------- */
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:.3s;display:flex;flex-direction:column}
.prod:hover{transform:translateY(-6px);border-color:var(--lime)}
.prod .pimg{aspect-ratio:1;background:var(--bg2) center/cover;display:grid;place-items:center;font-size:56px;cursor:pointer;position:relative}
.prod .pimg .sold{position:absolute;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;font-weight:800;letter-spacing:2px;font-size:14px}
.prod .pbody{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod h4{font-size:15px}
.prod .price{font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;color:var(--lime)}
.prod small{color:var(--muted);font-size:12px}
.prod .btn{margin-top:auto}
.chips-f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chips-f button{background:var(--card);border:1px solid var(--line);padding:7px 16px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted)}
.chips-f button.on{background:var(--lime);color:#0a0b0f;border-color:var(--lime)}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg2);border-left:1px solid var(--line);z-index:91;padding:22px;display:flex;flex-direction:column;animation:slideIn .3s}
.drawer .items{flex:1;overflow:auto;margin:14px 0}
.citem{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.citem .ci{width:56px;height:56px;border-radius:12px;background:var(--card) center/cover;flex:none;display:grid;place-items:center}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:26px;height:26px;border-radius:50%;background:var(--card);font-weight:800}
.cart-btn{position:relative;background:var(--card);width:38px;height:38px;border-radius:50%;font-size:17px}
.cbadge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:99px;background:var(--orange);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.bell-wrap{position:relative}
.bell-panel{position:absolute;right:0;top:46px;width:min(360px,92vw);max-height:70vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);z-index:80;animation:pop .2s}
.bell-panel header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}
.nitem{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.2s}
.nitem:hover{background:var(--card)}
.nitem.unread{background:rgba(198,255,61,.05)}
.nitem.unread b::before{content:"● ";color:var(--lime)}
.nitem img{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none}
.nitem b{display:block;font-size:14px;margin-bottom:2px}
.nitem p{font-size:12px;color:var(--muted);line-height:1.4}
.nitem small{font-size:11px;color:var(--muted)}
.ad-pop{position:fixed;right:18px;bottom:18px;width:min(320px,calc(100% - 36px));background:var(--card);border:1px solid var(--orange);border-radius:20px;overflow:hidden;z-index:120;box-shadow:0 20px 60px rgba(255,90,31,.25);animation:pop .4s}
.ad-pop img{width:100%;height:150px;object-fit:cover;display:block}
.ad-pop .ab{padding:14px 16px 16px}
.ad-pop .lbl{font-size:10px;letter-spacing:2px;color:var(--orange);font-weight:800;text-transform:uppercase}
.ad-pop h4{font-size:16px;margin:4px 0}
.ad-pop p{font-size:13px;color:var(--muted);margin-bottom:12px}
.ad-x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);font-size:13px}
.adm-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:22px}
.adm-stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.adm-stats b{display:block;font-family:var(--display);font-style:italic;font-size:34px;color:var(--lime)}
.adm-stats small{color:var(--muted);font-size:12px}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
/* ---------- actividades / rutas / conexiones (bloque 6) ---------- */
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.act-card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:.25s;display:flex;flex-direction:column}
.act-card:hover{transform:translateY(-4px);border-color:var(--lime)}
.act-card.is-hidden{opacity:.5}
.act-route{height:130px;background:var(--bg2);display:grid;place-items:center;position:relative}
.route-svg{width:100%;height:100%;display:block}
.route-empty{font-size:38px;opacity:.4}
.act-route .sport{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);border-radius:99px;padding:3px 10px;font-size:12px}
.act-body{padding:12px 14px 14px}
.act-body h4{font-size:15px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-body small{color:var(--muted);font-size:12px}
.act-stats{display:flex;gap:14px;margin-top:10px}
.act-stats div{flex:1}
.act-stats b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:20px;color:var(--lime)}
.act-stats span{font-size:11px;color:var(--muted)}
.act-author{display:flex;gap:8px;align-items:center;padding:10px 14px 0;font-size:13px;cursor:pointer}
.map-box{height:320px;border-radius:14px;overflow:hidden;margin:14px 0;background:var(--bg2);z-index:0}
.big-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:14px 0}
.big-stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.big-stats b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;color:var(--lime)}
.big-stats span{font-size:11px;color:var(--muted)}
.conn-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.conn-row:last-child{border-bottom:none}
.conn-row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.btn-strava{background:#fc4c02;color:#fff}
.btn-strava:hover{box-shadow:0 8px 30px rgba(252,76,2,.4)}
.switch{position:relative;width:52px;height:30px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.25s;cursor:pointer}
.switch span::before{content:"";position:absolute;width:22px;height:22px;left:4px;top:4px;background:#fff;border-radius:50%;transition:.25s}
.switch input:checked+span{background:var(--lime)}
.switch input:checked+span::before{transform:translateX(22px);background:#0a0b0f}
.consent{background:rgba(198,255,61,.06);border:1px solid rgba(198,255,61,.3);border-radius:16px;padding:16px;margin-bottom:8px}
.leaflet-container{font-family:var(--body)}
/* ---------- notificaciones push ---------- */
.push-banner{background:linear-gradient(90deg,rgba(198,255,61,.14),rgba(255,90,31,.12));border-bottom:1px solid var(--line)}
.push-banner .container{display:flex;gap:14px;align-items:center;justify-content:space-between;padding-top:10px;padding-bottom:10px;font-size:14px;flex-wrap:wrap}
.push-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;line-height:1.45}
/* ---------- idiomas ---------- */
.lang-wrap{position:relative}
.lang-btn{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:0 12px;height:38px;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.lang-btn:hover{border-color:var(--lime)}
.lang-btn b{font-size:12px;letter-spacing:1px}
.lang-menu{position:absolute;right:0;top:46px;min-width:190px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:6px;z-index:80;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .2s}
.lang-menu button{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;background:none;padding:10px 12px;border-radius:10px;font-size:14px;text-align:left}
.lang-menu button:hover{background:var(--card)}
.lang-menu button.on{background:var(--lime);color:#0a0b0f;font-weight:700}
.lang-menu i{font-style:normal;font-size:11px;opacity:.6;letter-spacing:1px}
/* chino y coreano: sin cursiva sintética y con fuentes del sistema que sí tienen esos caracteres */
html[lang^="zh"] body,html[lang="ko"] body{font-family:var(--body),'Noto Sans SC','Microsoft YaHei','PingFang SC','Noto Sans KR','Malgun Gothic',sans-serif}
html[lang^="zh"] .display,html[lang="ko"] .display,html[lang^="zh"] .logo,html[lang="ko"] .logo{font-style:normal;font-family:'Noto Sans SC','Microsoft YaHei','PingFang SC','Noto Sans KR','Malgun Gothic',sans-serif;font-weight:900;letter-spacing:0;line-height:1.1}
html[lang^="zh"] .hero h1 .stroke,html[lang="ko"] .hero h1 .stroke{-webkit-text-stroke:1.5px var(--text)}
/* ---------- noticias del mundo (slider) ---------- */
.wcard{flex:none;width:300px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:.3s;color:inherit}
.wcard:hover{transform:translateY(-6px);border-color:var(--blue);box-shadow:0 20px 50px rgba(61,165,255,.12)}
.wcard.skel{height:300px;background:linear-gradient(90deg,var(--card),var(--bg2),var(--card));background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.wimg{height:140px;position:relative;display:grid;place-items:center;overflow:hidden;font-size:46px}
.wimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wimg .tag{position:absolute;top:12px;left:12px}
.wbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.wbody h4{font-size:15.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.wbody p{font-size:13px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.wmeta{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted);margin-top:auto}
.wmeta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:#cfd2dc}
.wmeta time{white-space:nowrap}
.wread{font-size:12px;font-weight:800;color:var(--blue);letter-spacing:.5px}
@media(max-width:600px){.wcard{width:260px}}
/* ---------- barra superior con muchas pestañas ---------- */
.nav-in>.tabs{flex:1;min-width:0;justify-content:flex-start;margin:0 8px}
.nav-in>.tabs .tab{flex:none}
.nav-name{display:none;font-size:13px;color:var(--muted);white-space:nowrap}
@media(min-width:1500px){.nav-name{display:inline}}
@media(max-width:1180px){.nav-in>.tabs .tab{padding:8px 10px;font-size:12.5px}}
@media(max-width:600px){.nav-avatar{display:none}.nav-actions{margin-left:auto}.lang-btn{padding:0;width:34px;height:34px;justify-content:center}.lang-btn b{display:none}.lang-menu{right:-40px}}
@media(max-width:440px){.logo span:last-child{display:none}}
/* ---------- puntos, premios y HYROX (bloque 7) ---------- */
.pts-hero{background:linear-gradient(135deg,rgba(198,255,61,.14),rgba(255,90,31,.12)),var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.pts-big{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(56px,10vw,92px);line-height:.9;color:var(--lime)}
.pts-big small{font-size:.32em;color:var(--muted);margin-left:8px;font-style:normal;letter-spacing:1px}
.bar{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--orange));border-radius:99px;transition:width .6s}
.kind-pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:var(--bg2);color:var(--muted);align-self:flex-start}
.kind-pill.surprise{background:rgba(185,128,255,.16);color:#b980ff}.kind-pill.accessory{background:rgba(61,165,255,.16);color:var(--blue)}.kind-pill.benefit{background:rgba(198,255,61,.14);color:var(--lime)}
.rule-line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.rule-line:last-child{border-bottom:none}
.rule-line b{color:var(--lime);font-family:var(--display);font-style:italic;font-size:22px;min-width:64px;text-align:right}
.led{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.led b.pos{color:var(--lime)}.led b.neg{color:var(--orange)}
.hy-table{width:100%;border-collapse:collapse;font-size:13px}
.hy-table th,.hy-table td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
.hy-table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.hy-scroll{overflow-x:auto}
.level{display:inline-block;padding:3px 12px;border-radius:99px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.level.Principiante{background:rgba(139,144,160,.2);color:#cfd2dc}.level.Intermedio{background:rgba(61,165,255,.18);color:var(--blue)}
.level.Avanzado{background:rgba(198,255,61,.16);color:var(--lime)}.level.Élite{background:rgba(255,90,31,.2);color:var(--orange)}
.split-row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;align-items:center;padding:6px 0;font-size:13px}
.split-row input{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--text);font-size:13px;outline:none;width:100%}
.split-row input:focus{border-color:var(--lime)}
.split-row small{color:var(--muted);display:block;font-size:11px}
.insight{background:var(--bg2);border-left:3px solid var(--lime);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.55;margin-top:12px}
.insight.warn{border-left-color:var(--orange)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpis>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpis small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.kpis b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:28px;color:var(--lime);margin-top:2px}
.kpis span{font-size:12px;color:var(--muted)}
@media(max-width:600px){.split-row{grid-template-columns:1fr 1fr}.split-row>div:first-child{grid-column:1/-1}.tab{padding:8px 11px}}
@keyframes heart{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,255,61,.7)}70%{box-shadow:0 0 0 10px rgba(198,255,61,0)}100%{box-shadow:0 0 0 0 rgba(198,255,61,0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:900px){
  .hero-grid{grid-template-columns:1fr}
  .hslider{aspect-ratio:4/3.2;max-height:520px;width:100%}
  .hide-m{display:none}
  .show-m{display:block!important}
  .ncard{width:260px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important}}

/* ---------- autenticación ---------- */
function useAuth(){
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(CONFIGURED);

  const loadProfile = useCallback(async (uid, tries = 0) => {
    const { data } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
    if (data) setProfile(data);
    else if (tries < 3) setTimeout(() => loadProfile(uid, tries + 1), 700); // el trigger puede tardar un instante
  }, []);

  useEffect(() => {
    if (!CONFIGURED) return;
    sb.auth.getSession().then(({ data }) => { setSession(data.session); setLoading(false); if (data.session) loadProfile(data.session.user.id); });
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => {
      setSession(s);
      if (s) loadProfile(s.user.id); else setProfile(null);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  return { session, user: session?.user || null, profile, loading, reload: () => session && loadProfile(session.user.id) };
}

/* ---------- Reveal on scroll ---------- */
function Reveal({ children, delay = 0, className = '' }){
  const ref = useRef();
  const [on, setOn] = useState(false);
  useEffect(() => {
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting){ setOn(true); io.disconnect(); } }, { threshold: .15 });
    io.observe(ref.current); return () => io.disconnect();
  }, []);
  return <div ref={ref} className={`reveal ${on ? 'in' : ''} ${className}`} style={{ transitionDelay: delay + 'ms' }}>{children}</div>;
}

/* =====================================================================

function AuthModal({ initialRole = 'runner', initialMode = 'signup', onClose, toast }){
  const [mode, setMode] = useState(initialMode);      // login | signup
  const [role, setRole] = useState(initialRole);      // runner | partner
  const [f, setF] = useState({ name:'', email:'', pass:'', pass2:'', city:'', group:'' });
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [ok, setOk] = useState('');
  const set = k => e => setF({ ...f, [k]: e.target.value });

  const google = async () => {
    if (!CONFIGURED) return setErr('Configura primero SUPABASE_URL y SUPABASE_ANON_KEY en el archivo.');
    if (window.location.protocol === 'file:') return setErr('Google no funciona abriendo el archivo directo. Abre la página desde https://runnersco.online o desde un servidor local (npx serve -l 3000).');
    const { error } = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: window.location.origin + window.location.pathname } });
    if (error) setErr(error.message);
  };

  const submit = async e => {
    e.preventDefault(); setErr(''); setOk('');
    if (!CONFIGURED) return setErr('Configura primero SUPABASE_URL y SUPABASE_ANON_KEY en el archivo.');
    if (mode === 'signup'){
      if (!f.name.trim()) return setErr(t('auth.err.name', 'Escribe tu nombre.'));
      if (f.pass.length < 6) return setErr(t('auth.err.pass', 'La contraseña debe tener al menos 6 caracteres.'));
      if (f.pass !== f.pass2) return setErr(t('auth.err.match', 'Las contraseñas no coinciden.'));
      if (role === 'partner' && !f.group.trim()) return setErr(t('auth.err.group', 'Escribe el nombre de tu grupo de runners.'));
    }
    setBusy(true);
    try {
      if (mode === 'login'){
        const { error } = await sb.auth.signInWithPassword({ email:f.email, password:f.pass });
        if (error) throw error;
        toast(t('auth.welcome', '¡Bienvenido de vuelta! 🏃')); onClose();
      } else {
        const { data, error } = await sb.auth.signUp({
          email:f.email, password:f.pass,
          options:{ data:{ full_name:f.name.trim(), role, city:f.city.trim() || null, group_name: role === 'partner' ? f.group.trim() : null } }
        });
        if (error) throw error;
        if (data.session){ toast(t('auth.created', '¡Cuenta creada! 🎉')); onClose(); }
        else setOk(t('auth.ok.created', 'Cuenta creada. Revisa tu correo para confirmar y luego inicia sesión.'));
      }
    } catch (ex){
      const m = ex.message || '';
      setErr(/Invalid login/i.test(m) ? t('auth.err.bad', 'Correo o contraseña incorrectos.') : /already registered/i.test(m) ? t('auth.err.exists', 'Ese correo ya está registrado.') : m);
    }
    setBusy(false);
  };

  return (
    <div className="overlay" onMouseDown={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <button className="x" onClick={onClose} aria-label="Cerrar">✕</button>
        <div className="logo logo-lg" style={{ marginBottom:10 }}><LogoMark /></div>
        <h2 className="display">{mode === 'login' ? t('auth.login', 'Entrar') : t('auth.join', 'Únete')}</h2>
        <p className="sub">{mode === 'login' ? t('auth.sub.login', 'Accede con tu cuenta.') : role === 'partner' ? t('auth.sub.partner', 'Crea tu grupo y tu propia página.') : t('auth.sub.runner', 'Registra tus tiempos y comparte tus carreras.')}</p>

        {mode === 'signup' && (
          <div className="seg">
            <button type="button" className={role === 'runner' ? 'on' : ''} onClick={() => setRole('runner')}>{t('auth.role.runner', '🏃 Runner')}</button>
            <button type="button" className={role === 'partner' ? 'on' : ''} onClick={() => setRole('partner')}>{t('auth.role.partner', '🤝 Partner de grupo')}</button>
          </div>
        )}

        {err && <div className="msg err">{err}</div>}
        {ok && <div className="msg ok">{ok}</div>}

        <button className="btn btn-google" onClick={google} type="button">
          <GoogleIcon />
          {t('auth.google', 'Continuar con Google')}
        </button>
        <div className="divider">{t('auth.or', 'o con correo y contraseña')}</div>

        <form onSubmit={submit}>
          {mode === 'signup' && <div className="field"><label>{t('auth.name', 'Nombre completo')}</label><input value={f.name} onChange={set('name')} placeholder={t('auth.name.ph', 'Ej. Laura Gómez')} /></div>}
          <div className="field"><label>{t('auth.email', 'Correo')}</label><input type="email" required value={f.email} onChange={set('email')} placeholder="tu@correo.com" autoComplete="email" /></div>
          <div className="field"><label>{t('auth.pass', 'Contraseña')}</label><input type="password" required value={f.pass} onChange={set('pass')} placeholder={t('auth.pass.ph', 'Mínimo 6 caracteres')} autoComplete={mode === 'login' ? 'current-password' : 'new-password'} /></div>
          {mode === 'signup' && <>
            <div className="field"><label>{t('auth.pass2', 'Repetir contraseña')}</label><input type="password" required value={f.pass2} onChange={set('pass2')} autoComplete="new-password" /></div>
            <div className="field"><label>{t('auth.city', 'Ciudad')}</label><input value={f.city} onChange={set('city')} placeholder={t('auth.city.ph', 'Ej. Medellín')} /></div>
            <div className={`expand ${role === 'partner' ? 'open' : ''}`}>
              <div className="partner-box">
                <div className="field" style={{ marginBottom:0 }}><label>{t('auth.group', 'Nombre de tu grupo de runners')}</label><input value={f.group} onChange={set('group')} placeholder={t('auth.group.ph', 'Ej. Los Madrugadores RC')} /></div>
              </div>
            </div>
          </>}
          <button className={`btn ${role === 'partner' && mode === 'signup' ? 'btn-orange' : 'btn-lime'}`} style={{ width:'100%' }} disabled={busy}>
            {busy ? t('auth.busy', 'Un momento…') : mode === 'login' ? t('auth.login', 'Entrar') : role === 'partner' ? t('auth.submit.partner', 'Registrar mi grupo') : t('auth.submit.runner', 'Crear mi cuenta')}
          </button>
        </form>

        <p style={{ textAlign:'center', marginTop:16, fontSize:13, color:'var(--muted)' }}>
          {mode === 'login' ? t('auth.noacc', '¿Aún no tienes cuenta? ') : t('auth.hasacc', '¿Ya tienes cuenta? ')}
          <button className="link" onClick={() => { setMode(mode === 'login' ? 'signup' : 'login'); setErr(''); setOk(''); }}>
            {mode === 'login' ? t('auth.signup', 'Regístrate') : t('auth.signin', 'Inicia sesión')}
          </button>
        </p>
      </div>
    </div>
  );
}

function useNews(){
  const [news, setNews] = useState([]);

  useEffect(() => {

    (async () => {
      if (sb){
        const { data } = await sb.from('news').select('*').eq('published', true).order('created_at', { ascending:false }).limit(40);
        if (live && data && data.length){ setNews(data); setDemo(false); return; }

      if (live){ setNews(DEMO_NEWS); setDemo(true); }
    })();
    return () => { live = false; };
  }, []);
  return { news, demo };
}

    <div className="cascade">

          <div key={r.c}>

  );

/* ---------- enlaces de medios (Drive, YouTube, directos) ---------- */
function driveId(url){
  const m = (url || '').match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=|thumbnail\?id=)([\w-]+)/);
  return m ? m[1] : null;
}
function imgSrc(url){
  const id = driveId(url);
  return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1600` : url;
}
function mediaInfo(url, type){
  const yt = youtubeId(url);
  if (yt) return { kind:'embed', src:`https://www.youtube.com/embed/${yt}` };
  const id = driveId(url);
  if (type === 'video') return id ? { kind:'embed', src:`https://drive.google.com/file/d/${id}/preview` } : { kind:'video', src:url };
  return { kind:'image', src:imgSrc(url) };
}
function MediaView({ url, type }){
  const m = mediaInfo(url, type);
  return <div className="post-media">
    {m.kind === 'embed' ? <iframe src={m.src} allowFullScreen title="video" />
      : m.kind === 'video' ? <video src={m.src} controls playsInline />
      : <img src={m.src} alt="" loading="lazy" referrerPolicy="no-referrer" onError={e => { e.target.style.display = 'none'; }} />}
  </div>;
}
function Avatar({ p, size = 34 }){
  const st = { width:size, height:size, fontSize:size * .4 };
  return p?.avatar_url
    ? <img className="avatar" style={st} src={imgSrc(p.avatar_url)} alt="" referrerPolicy="no-referrer" />
    : <div className="avatar" style={st}>{initials(p?.full_name || '?')}</div>;
}
const ago = d => {
  const s = (new Date(d) - Date.now()) / 1000, a = Math.abs(s);       // negativo = pasado
  const rtf = new Intl.RelativeTimeFormat(LOC(), { numeric:'auto', style:'short' });
  if (a < 60) return rtf.format(0, 'second');
  if (a < 3600) return rtf.format(Math.round(s / 60), 'minute');
  if (a < 86400) return rtf.format(Math.round(s / 3600), 'hour');
  if (a < 604800) return rtf.format(Math.round(s / 86400), 'day');
  return fmtDate(d);
};

/* ---------- publicación ---------- */
function PostCard({ post, me, onProfile, onChange, onDelete, toast }){
  const liked = post.post_likes.some(l => l.user_id === me.id);
  const [open, setOpen] = useState(false);
  const [comments, setComments] = useState(null);
  const [txt, setTxt] = useState('');

  const loadComments = async () => {
    const { data } = await sb.from('post_comments').select('*, author:profiles(full_name,username,avatar_url)').eq('post_id', post.id).order('created_at');
    setComments(data || []);
  };
  const toggleComments = () => { const v = !open; setOpen(v); if (v && !comments) loadComments(); };
  const like = async () => {
    const next = liked ? post.post_likes.filter(l => l.user_id !== me.id) : [...post.post_likes, { user_id:me.id }];
    onChange({ ...post, post_likes:next });
    const { error } = liked
      ? await sb.from('post_likes').delete().eq('post_id', post.id).eq('user_id', me.id)
      : await sb.from('post_likes').insert({ post_id:post.id, user_id:me.id });
    if (error){ onChange(post); toast('No se pudo actualizar el like'); }
  };
  const send = async e => {
    e.preventDefault(); if (!txt.trim()) return;
    const { error } = await sb.from('post_comments').insert({ post_id:post.id, user_id:me.id, body:txt.trim() });
    if (error) return toast('No se pudo comentar');
    setTxt(''); loadComments(); onChange({ ...post, post_comments:[...post.post_comments, { id:'tmp' + Date.now() }] });
  };
  const a = post.author;
  return (
    <article className="post">
      <div className="post-head">
        <Avatar p={a} />
        <div className="who" onClick={() => onProfile(post.user_id)}><b>{a?.full_name}</b><small>{a?.username ? '@' + a.username + ' · ' : ''}{ago(post.created_at)}</small></div>
        {(post.user_id === me.id) && <button className="link" onClick={() => onDelete(post)}>Eliminar</button>}
      </div>
      <MediaView url={post.media_url} type={post.media_type} />
      <div className="post-actions">
        <button className={liked ? 'liked' : ''} onClick={like} aria-label="Me gusta">{liked ? '❤️' : '🤍'}</button>
        <button onClick={toggleComments} aria-label="Comentarios">💬</button>
      </div>
      <div className="post-body">
        <b>{post.post_likes.length} me gusta</b>
        {post.event_name && <div className="ev">🏁 {post.event_name}</div>}
        {post.caption && <div><b>{a?.username || a?.full_name}</b> {post.caption}</div>}

/* ---------- feed ---------- */
function Feed({ me, onProfile, toast }){
  const [posts, setPosts] = useState(null);
  const [scope, setScope] = useState('all');
  const [creating, setCreating] = useState(false);

  const load = useCallback(async () => {
    let q = sb.from('posts').select('*, author:profiles(id,full_name,username,avatar_url), post_likes(user_id), post_comments(id)').order('created_at', { ascending:false }).limit(50);
    if (scope === 'following'){
      const { data: fl } = await sb.from('follows').select('following_id').eq('follower_id', me.id);
      const ids = (fl || []).map(x => x.following_id).concat(me.id);
      q = q.in('user_id', ids);
    }
    const { data } = await q;
    setPosts(data || []);
  }, [scope, me.id]);

  useEffect(() => { setPosts(null); load(); }, [load]);
  useEffect(() => {
    const ch = sb.channel('posts-live').on('postgres_changes', { event:'INSERT', schema:'public', table:'posts' }, () => load()).subscribe();
    return () => { sb.removeChannel(ch); };
  }, [load]);

  const del = async p => {
    if (!window.confirm('¿Eliminar esta publicación?')) return;
    const { error } = await sb.from('posts').delete().eq('id', p.id);
    if (error) return toast('No se pudo eliminar');
    setPosts(ps => ps.filter(x => x.id !== p.id));
  };

  return (
    <div className="container panel"><div className="feed">
      <div className="feed-top">
        <div className="pill-tabs"><button className={scope === 'all' ? 'on' : ''} onClick={() => setScope('all')}>{t('feed.foryou', 'Para ti')}</button><button className={scope === 'following' ? 'on' : ''} onClick={() => setScope('following')}>{t('feed.following', 'Siguiendo')}</button></div>
        <button className="btn btn-lime btn-sm" onClick={() => setCreating(true)}>{t('feed.post', '＋ Publicar')}</button>
      </div>
      {posts === null ? <div className="empty"><div className="spinner" style={{ margin:'0 auto' }} /></div>
        : posts.length === 0 ? <div className="empty">{scope === 'following' ? 'Sigue a otros runners para ver sus publicaciones aquí.' : 'Aún no hay publicaciones. ¡Sé el primero!'}</div>
        : posts.map(p => <PostCard key={p.id} post={p} me={me} onProfile={onProfile} onDelete={del} toast={toast}
            onChange={np => setPosts(ps => ps.map(x => x.id === np.id ? np : x))} />)}
    </div>
    {creating && <NewPostModal me={me} onClose={() => setCreating(false)} onDone={load} toast={toast} />}
    </div>
  );
}

/* ---------- tiempos ---------- */
const DIST = { '5K':5, '10K':10, '21K':21.0975, '42K':42.195, other:'' };
const fmtTime = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const fmtPace = (s, km) => { const p = Math.round(s / km); return Math.floor(p / 60) + ':' + String(p % 60).padStart(2, '0') + ' /km'; };
const SOURCES = ['strava','garmin','coros','polar','suunto','apple','nike','manual'];

function RecordsPanel({ userId, own, toast, defaultCity, onChanged }){
  const [recs, setRecs] = useState(null);
  const [f, setF] = useState({ label:'5K', km:'5', h:'0', m:'', s:'', date:new Date().toISOString().slice(0, 10), source:'strava', url:'', city:defaultCity || '' });
  const [geo, setGeo] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const set = k => e => setF({ ...f, [k]: e.target.value });

  const load = useCallback(async () => {
    const { data } = await sb.from('records').select('*').eq('user_id', userId).order('activity_date', { ascending:false });
    setRecs(data || []);
  }, [userId]);
  useEffect(() => { load(); }, [load]);

  const locate = () => navigator.geolocation
    ? navigator.geolocation.getCurrentPosition(p => { setGeo({ lat:p.coords.latitude, lng:p.coords.longitude }); toast('📍 Ubicación agregada'); }, () => toast('No se pudo obtener la ubicación'))
    : toast('Tu navegador no soporta geolocalización');

  const submit = async e => {
    e.preventDefault(); setErr('');
    const secs = (+f.h || 0) * 3600 + (+f.m || 0) * 60 + (+f.s || 0);
    const km = +f.km;
    if (secs <= 0) return setErr('Ingresa el tiempo.');
    if (!(km > 0)) return setErr('Ingresa la distancia.');
    if (f.url && !/^https?:\/\//i.test(f.url)) return setErr('El enlace debe empezar con https://');
    setBusy(true);
    const { error } = await sb.from('records').insert({
      user_id:userId, distance_label:f.label, distance_km:km, time_seconds:secs, activity_date:f.date, source:f.source,
      activity_url:f.url.trim() || null, city:f.city.trim() || null, lat:geo?.lat ?? null, lng:geo?.lng ?? null
    });
    setBusy(false);
    if (error) return setErr(error.message);
    toast('⏱️ Tiempo guardado'); setF({ ...f, h:'0', m:'', s:'', url:'' }); load(); onChanged && onChanged();
  };
  const del = async r => { if (!window.confirm('¿Borrar este tiempo?')) return; await sb.from('records').delete().eq('id', r.id); load(); onChanged && onChanged(); };

  return (
    <div className="pcard" style={{ marginTop:22 }}>
      <h3 className="display" style={{ fontSize:32, marginBottom:14 }}>⏱️ Tiempos</h3>
      {own && <form onSubmit={submit} style={{ marginBottom:20 }}>
        {err && <div className="msg err">{err}</div>}
        <div className="form-row">
          <div className="field"><label>Distancia</label><select value={f.label} onChange={e => setF({ ...f, label:e.target.value, km:String(DIST[e.target.value]) })}>{Object.keys(DIST).map(k => <option key={k} value={k}>{k === 'other' ? 'Otra' : k}</option>)}</select></div>
          <div className="field"><label>Kilómetros</label><input type="number" step="0.01" value={f.km} onChange={set('km')} disabled={f.label !== 'other'} /></div>
        </div>
        <div className="field"><label>Tiempo (h · min · seg)</label><div className="time-row">
          <input type="number" min="0" placeholder="h" value={f.h} onChange={set('h')} /><input type="number" min="0" max="59" placeholder="min" value={f.m} onChange={set('m')} /><input type="number" min="0" max="59" placeholder="seg" value={f.s} onChange={set('s')} />
        </div></div>
        <div className="form-row">
          <div className="field"><label>Fecha</label><input type="date" value={f.date} onChange={set('date')} max={new Date().toISOString().slice(0, 10)} /></div>
          <div className="field"><label>App</label><select value={f.source} onChange={set('source')}>{SOURCES.map(s => <option key={s}>{s}</option>)}</select></div>
        </div>
        <div className="field"><label>Enlace a la actividad (Strava, etc.) — opcional</label><input value={f.url} onChange={set('url')} placeholder="https://www.strava.com/activities/…" /></div>
        <div className="form-row">
          <div className="field"><label>Ciudad de la carrera</label><input value={f.city} onChange={set('city')} /></div>
          <div className="field"><label>&nbsp;</label><button type="button" className="btn btn-ghost btn-sm" style={{ width:'100%', padding:'13px' }} onClick={locate}>{geo ? '📍 Ubicación lista' : '📍 Usar mi ubicación'}</button></div>
        </div>
        <button className="btn btn-lime" style={{ width:'100%' }} disabled={busy}>{busy ? 'Guardando…' : 'Guardar tiempo'}</button>
      </form>}
      {recs === null ? <div className="spinner" style={{ margin:'20px auto' }} />
        : recs.length === 0 ? <div className="empty">{own ? 'Aún no has registrado tiempos.' : 'Este runner aún no tiene tiempos.'}</div>
        : recs.map(r => (
          <div className="rec" key={r.id}>
            <div><span className="big">{fmtTime(r.time_seconds)}</span> <b>{r.distance_label === 'other' ? r.distance_km + ' km' : r.distance_label}</b><br />
              <small>{fmtPace(r.time_seconds, r.distance_km)} · {fmtDate(r.activity_date)} · {r.source}{r.city ? ' · ' + r.city : ''}</small></div>
            <div style={{ display:'flex', gap:10 }}>
              {r.activity_url && <a className="link" href={r.activity_url} target="_blank" rel="noopener noreferrer">Ver ↗</a>}
              {own && <button className="link" style={{ color:'var(--danger)' }} onClick={() => del(r)}>Borrar</button>}
            </div>
          </div>))}
    </div>
  );
}

/* layout: 'slider' (landing) | 'grid' (pestaña Grupos) */
function GroupsBrowser({ layout = 'slider', onOpen, empty }){
  const [groups, setGroups] = useState(null);
  const [q, setQ] = useState('');
  const track = useRef(); const hover = useRef(false);
  useEffect(() => {
    if (!sb) return setGroups([]);
    sb.from('groups').select('*, group_members(count)').order('created_at', { ascending:false }).limit(60).then(({ data }) => setGroups(data || []));
  }, []);
  useEffect(() => {
    if (layout !== 'slider') return;
    const t = setInterval(() => {
      const el = track.current; if (!el || hover.current) return;
      el.scrollLeft + el.clientWidth >= el.scrollWidth - 10 ? el.scrollTo({ left:0, behavior:'smooth' }) : el.scrollBy({ left:308, behavior:'smooth' });
    }, 3800);
    return () => clearInterval(t);
  }, [layout, groups]);

  if (groups === null) return <div className="empty"><div className="spinner" style={{ margin:'0 auto' }} /></div>;
  if (groups.length === 0) return empty || <div className="empty">Aún no hay grupos registrados.</div>;
  const list = groups.filter(g => (g.name + ' ' + (g.city || '')).toLowerCase().includes(q.toLowerCase()));
  const scroll = d => track.current?.scrollBy({ left:d * 308, behavior:'smooth' });

  if (layout === 'grid') return (<>
    <div className="field" style={{ maxWidth:360 }}><input placeholder={t('gtab.search', '🔍 Buscar por nombre o ciudad')} value={q} onChange={e => setQ(e.target.value)} /></div>
    {list.length === 0 ? <div className="empty">{t('gtab.none', 'Sin resultados.')}</div> : <div className="ggrid">{list.map(g => <GroupCard key={g.id} g={g} onOpen={onOpen} />)}</div>}
  </>);
  return (
    <div className="gslider" onMouseEnter={() => hover.current = true} onMouseLeave={() => hover.current = false}>
      <button className="garrow l" onClick={() => scroll(-1)} aria-label="Anterior">‹</button>
      <div className="gtrack" ref={track}>{groups.map(g => <GroupCard key={g.id} g={g} onOpen={onOpen} />)}</div>
      <button className="garrow r" onClick={() => scroll(1)} aria-label="Siguiente">›</button>
    </div>
  );
}

/* ---------- calendario mensual ---------- */
function Calendar({ events }){
  const [m, setM] = useState(new Date());
  const [sel, setSel] = useState(null);
  const y = m.getFullYear(), mo = m.getMonth();
  const offset = (new Date(y, mo, 1).getDay() + 6) % 7;
  const days = new Date(y, mo + 1, 0).getDate();
  const byDay = {};
  events.forEach(e => { const d = new Date(e.starts_at); if (d.getFullYear() === y && d.getMonth() === mo) (byDay[d.getDate()] = byDay[d.getDate()] || []).push(e); });
  const today = new Date();
  const isToday = d => today.getFullYear() === y && today.getMonth() === mo && today.getDate() === d;
  return (
    <div className="cal">
      <div className="cal-head">
        <button onClick={() => { setM(new Date(y, mo - 1, 1)); setSel(null); }}>‹</button>
        <b>{m.toLocaleString(LOC(), { month:'long', year:'numeric' })}</b>
        <button onClick={() => { setM(new Date(y, mo + 1, 1)); setSel(null); }}>›</button>
      </div>
      <div className="cal-grid">
        {['L','M','X','J','V','S','D'].map(d => <div key={d} className="dow">{d}</div>)}
        {Array.from({ length:offset }).map((_, i) => <div key={'o' + i} />)}
        {Array.from({ length:days }).map((_, i) => { const d = i + 1; return <button key={d} className={`d ${byDay[d] ? 'ev' : ''} ${isToday(d) ? 'today' : ''} ${sel === d ? 'sel' : ''}`} onClick={() => setSel(sel === d ? null : d)}>{d}</button>; })}
      </div>
      {sel && <div style={{ marginTop:14 }}>{(byDay[sel] || []).length === 0 ? <small style={{ color:'var(--muted)' }}>Sin actividades este día.</small> : byDay[sel].map(e => <EventItem key={e.id} e={e} />)}</div>}
    </div>
  );
}
function EventItem({ e, onDelete }){
  const d = new Date(e.starts_at);
  return (
    <div className="ev-item">
      <div className="ev-date"><b>{d.getDate()}</b><small>{d.toLocaleString(LOC(), { month:'short' })}</small></div>
      <div style={{ flex:1, minWidth:0 }}>
        <h4>{EVT[e.event_type]?.[0]} {e.title}</h4>

}

function GroupPage({ groupId, me, profile, openAuth, onBack, onProfile, onManage, toast }){
  const [d, setD] = useState(null);

  const [join, setJoin] = useState(false);

  const load = useCallback(async () => {
    const [g, mem, news, ev, media] = await Promise.all([
      sb.from('groups').select('*').eq('id', groupId).maybeSingle(),
      sb.from('group_members').select('*, profile:profiles(id,full_name,username,avatar_url,city)').eq('group_id', groupId),
      sb.from('group_news').select('*').eq('group_id', groupId).order('created_at', { ascending:false }),
      sb.from('group_events').select('*').eq('group_id', groupId).order('starts_at'),
      sb.from('group_media').select('*').eq('group_id', groupId).order('created_at', { ascending:false }),
    ]);
    let owner = null;
    if (g.data) owner = (await sb.from('profiles').select('id,full_name,username,avatar_url,city').eq('id', g.data.owner_id).maybeSingle()).data;
    setD({ g:g.data, mem:mem.data || [], news:news.data || [], ev:ev.data || [], media:media.data || [], owner });
  }, [groupId]);
  useEffect(() => { setD(null); load(); }, [load]);

  if (!d) return <div className="container panel"><div className="empty"><div className="spinner" style={{ margin:'0 auto' }} /></div></div>;
  const { g, mem, news, ev, media, owner } = d;
  if (!g) return <div className="container panel"><div className="empty">Este grupo no existe.</div><button className="btn btn-ghost btn-sm" onClick={onBack}>← Volver</button></div>;

  const isOwner = me && g.owner_id === me.id;
  const isMember = me && mem.some(m => m.user_id === me.id);
  const upcoming = ev.filter(e => new Date(e.starts_at) >= new Date());

function useRows(table, gid, order = 'created_at', asc = false){
  const [rows, setRows] = useState(null);
  const load = useCallback(async () => {
    const { data } = await sb.from(table).select('*').eq('group_id', gid).order(order, { ascending:asc });
    setRows(data || []);
  }, [table, gid]);
  useEffect(() => { setRows(null); load(); }, [load]);
  return [rows, load];
}
const confirmDel = async (table, id, reload, toast) => {
  if (!window.confirm('¿Eliminar?')) return;
  const { error } = await sb.from(table).delete().eq('id', id);
  error ? toast(error.message) : reload();
};

function InfoEditor({ g, onSaved, toast }){
  const [f, setF] = useState({ name:g.name, tagline:g.tagline || '', description:g.description || '', history:g.history || '', cover_url:g.cover_url || '', logo_url:g.logo_url || '', city:g.city || '', contact:g.contact || '' });
  const [busy, setBusy] = useState(false);
  const set = k => e => setF({ ...f, [k]: e.target.value });
  const save = async e => {
    e.preventDefault(); setBusy(true);
    const p = Object.fromEntries(Object.entries(f).map(([k, v]) => [k, typeof v === 'string' ? (v.trim() || null) : v])); p.name = f.name.trim() || g.name;
    const { error } = await sb.from('groups').update(p).eq('id', g.id);
    setBusy(false); error ? toast(error.message) : (toast('Página actualizada ✅'), onSaved());
  };
  return (
    <form onSubmit={save}>
      <div className="form-row"><div className="field"><label>Nombre del grupo</label><input required value={f.name} onChange={set('name')} /></div><div className="field"><label>Ciudad</label><input value={f.city} onChange={set('city')} /></div></div>

/* ---- partner: avisos push a los integrantes de su grupo ---- */
function GroupPush({ g, toast }){
  const [f, setF] = useState({ title:'', body:'', url:'' });
  const [info, setInfo] = useState(null);          // { members, devices, remaining, limit } · false = función no disponible
  const [rows, setRows] = useState(null);
  const [busy, setBusy] = useState(false);
  const set = k => e => setF({ ...f, [k]: e.target.value });
  const loadInfo = useCallback(() => { if (PUSH_CONFIGURED) callSendPush({ action:'group_count', group_id:g.id }).then(setInfo).catch(() => setInfo(false)); }, [g.id]);
  const loadRows = useCallback(async () => {
    const { data } = await sb.from('notifications').select('*').eq('group_id', g.id).order('created_at', { ascending:false }).limit(20);
    setRows(data || []);
  }, [g.id]);
  useEffect(() => { loadInfo(); loadRows(); }, [loadInfo, loadRows]);

  const send = async e => {
    e.preventDefault();
    if (f.url.trim() && !/^https?:\/\//i.test(f.url.trim())) return toast('El enlace debe empezar con https://');
    setBusy(true);
    try {
      const r = await callSendPush({ action:'group', group_id:g.id, title:f.title, body:f.body, url:f.url.trim() || undefined });
      toast(`Aviso enviado a ${r.members} integrante(s) 🔔 · push a ${r.sent} de ${r.total} dispositivos${pushHint(r.errors)}`);
      setF({ title:'', body:'', url:'' }); loadInfo(); loadRows();
    } catch (ex) { toast(ex.message); }
    setBusy(false);
  };
  const test = async () => {
    setBusy(true);
    try { const r = await callSendPush({ test:true }); toast(r.total === 0 ? 'Este dispositivo no está suscrito: activa las notificaciones en la campana 🔔' : `Prueba enviada a ${r.sent} de ${r.total} dispositivo(s). Cierra la app y espera unos segundos.${pushHint(r.errors)}`); }
    catch (ex) { toast(ex.message); }
    setBusy(false);
  };

  if (!PUSH_CONFIGURED) return <div className="empty">Las notificaciones push aún no están activadas en el sitio. Pídele al administrador que complete la configuración.</div>;
  const none = info && info.remaining <= 0;
  return (<>
    <form onSubmit={send} style={{ marginBottom:20 }}>
      <p className="sub">Escribe un aviso para tus integrantes: les llega como notificación al teléfono (aunque tengan la app cerrada) y queda en su campana 🔔. Al tocarla se abre la página de tu grupo.</p>
      <div className="insight" style={{ marginTop:0, marginBottom:14 }}>
        {info === null ? 'Calculando…' : info === false ? 'No se pudo leer la función send-push (¿está desplegada?).'
          : <>👥 <b>{info.members}</b> integrante(s) · 📱 <b>{info.devices}</b> dispositivo(s) con notificaciones activas · te quedan <b>{info.remaining}</b> de {info.limit} avisos hoy.
              {info.members > 0 && info.devices < info.members && <> Los demás lo verán en su campana 🔔 cuando entren.</>}</>}
      </div>
      <div className="field"><label>Título</label><input required maxLength={60} value={f.title} onChange={set('title')} placeholder="Salida larga este domingo" /></div>
      <div className="field"><label>Mensaje (opcional)</label><textarea rows="3" maxLength={200} value={f.body} onChange={set('body')} placeholder="6:00 am en el parque, llevar hidratación" /></div>
      <div className="field"><label>Enlace (opcional; por defecto abre la página de tu grupo)</label><input value={f.url} onChange={set('url')} placeholder="https://…" /></div>
      <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
        <button className="btn btn-orange btn-sm" disabled={busy || none || !f.title.trim()}>{busy ? 'Enviando…' : none ? 'Límite diario alcanzado' : 'Enviar a mis integrantes'}</button>
        <button type="button" className="btn btn-ghost btn-sm" disabled={busy} onClick={test}>🧪 Probar en mi dispositivo</button>
      </div>
    </form>
    <h3 className="display" style={{ fontSize:24, marginBottom:6 }}>Avisos enviados</h3>
    {rows === null ? <div className="spinner" /> : rows.length === 0 ? <div className="empty">Aún no has enviado avisos.</div> : rows.map(n => (
      <div className="adm-row" key={n.id}><div><b>{n.title}</b><small>{fmtDT(n.created_at)}{n.body ? ' · ' + n.body : ''}</small></div></div>))}
  </>);
}

    setGroups(data || []);
  }, [me.id]);

  const g = groups?.[idx];
  useEffect(() => {
    if (!g) return;
    sb.from('group_join_requests').select('id', { count:'exact', head:true }).eq('group_id', g.id).eq('status', 'pending').then(({ count }) => setPending(count || 0));

    e.preventDefault(); if (!name.trim()) return;

  return (
    <div className="container panel" style={{ maxWidth:860 }}>

        <form className="pcard" onSubmit={create}><h3 className="display" style={{ fontSize:30, marginBottom:8 }}>Crea tu primer grupo</h3>
          <p className="sub">Tendrá su propia página con noticias, calendario, fotos e integrantes.</p>
          <div className="field"><input value={name} onChange={e => setName(e.target.value)} placeholder="Nombre del grupo" required /></div>
          <button className="btn btn-orange">Crear grupo</button></form>
      ) : <>
        <div className="pill-tabs" style={{ overflowX:'auto', marginBottom:18 }}>{SECS.map(([k, l]) => <button key={k} className={sec === k ? 'on' : ''} style={{ whiteSpace:'nowrap' }} onClick={() => setSec(k)}>{l}</button>)}</div>
        <div className="pcard" key={g.id + sec}>
          {sec === 'info' && <InfoEditor g={g} onSaved={load} toast={toast} />}
          {sec === 'news' && <NewsAdmin gid={g.id} toast={toast} />}
          {sec === 'events' && <EventsAdmin gid={g.id} toast={toast} />}
          {sec === 'media' && <MediaAdmin gid={g.id} toast={toast} />}
          {sec === 'req' && <RequestsAdmin gid={g.id} toast={toast} />}
          {sec === 'mem' && <MembersAdmin gid={g.id} toast={toast} />}
          {sec === 'push' && <GroupPush g={g} toast={toast} />}
        </div>
      </>}
    </div>
  );
}

/* =====================================================================
   NOTIFICACIONES Y PUBLICIDAD (lado usuario)
