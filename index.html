  return (
    <div className="container panel" style={{ maxWidth:900 }}>
      <div className="sec-head"><h2 className="display">HY<em>ROX</em></h2><p>{t('hy.desc', 'Running + 8 estaciones funcionales. Registra tus carreras y simulacros, mide tu evolución y suma puntos.')}</p></div>
      <div className="pill-tabs" style={{ overflowX:'auto', marginBottom:20 }}>
        {[['progress', t('hy.tab.progress', '📈 Mi progreso')], ['add', t('hy.tab.add', '➕ Registrar')], ['ranking', t('hy.tab.ranking', '🏆 Ranking')], ['guide', t('hy.tab.guide', '📖 Guía')]].map(([k, l]) =>
          <button key={k} style={{ whiteSpace:'nowrap' }} className={sec === k ? 'on' : ''} onClick={() => setSec(k)}>{l}</button>)}
      </div>
      {sec === 'progress' && <HyroxProgress me={me} refreshKey={rk} onChanged={() => setRk(k => k + 1)} toast={toast} />}
      {sec === 'add' && <HyroxForm me={me} toast={toast} onSaved={() => { setRk(k => k + 1); setSec('progress'); }} />}
      {sec === 'ranking' && <HyroxRanking me={me} onProfile={onProfile} />}
      {sec === 'guide' && <HyroxGuide />}
    </div>
  );
}

/* ---------- editor de perfil ---------- */
function ProfileEditor({ p, onClose, onSaved, toast }){
  const [f, setF] = useState({ full_name:p.full_name || '', username:p.username || '', bio:p.bio || '', city:p.city || '', country:p.country || '', avatar_url:p.avatar_url || '', strava_url:p.strava_url || '', lat:p.lat, lng:p.lng });
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const set = k => e => setF({ ...f, [k]: e.target.value });
  const locate = () => navigator.geolocation
    ? navigator.geolocation.getCurrentPosition(x => { setF(o => ({ ...o, lat:x.coords.latitude, lng:x.coords.longitude })); toast('📍 Ubicación guardada en el formulario'); }, () => toast('No se pudo obtener la ubicación'))
    : toast('Tu navegador no soporta geolocalización');
  const submit = async e => {
    e.preventDefault(); setErr('');
    const un = f.username.trim().toLowerCase();
    if (un && !/^[a-z0-9_.]{3,20}$/.test(un)) return setErr('Usuario: 3–20 caracteres (letras, números, _ y .)');
    setBusy(true);
    const { error } = await sb.from('profiles').update({
      full_name:f.full_name.trim(), username:un || null, bio:f.bio.trim() || null, city:f.city.trim() || null, country:f.country.trim() || null,
      avatar_url:f.avatar_url.trim() || null, strava_url:f.strava_url.trim() || null, lat:f.lat ?? null, lng:f.lng ?? null
    }).eq('id', p.id);
    setBusy(false);
    if (error) return setErr(error.code === '23505' ? 'Ese nombre de usuario ya existe.' : error.message);
    toast('Perfil actualizado ✅'); onSaved(); onClose();
  };
  return (
    <div className="overlay" onMouseDown={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <button className="x" onClick={onClose}>✕</button>
        <h2 className="display">Editar perfil</h2><p className="sub">&nbsp;</p>
        {err && <div className="msg err">{err}</div>}
        <form onSubmit={submit}>
          <div className="field"><label>Nombre</label><input value={f.full_name} onChange={set('full_name')} required /></div>
          <div className="field"><label>Usuario</label><input value={f.username} onChange={set('username')} placeholder="ej. laura.corre" /></div>
          <div className="field"><label>Biografía</label><textarea rows="3" value={f.bio} onChange={set('bio')} maxLength={200} /></div>
          <div className="form-row">
            <div className="field"><label>Ciudad</label><input value={f.city} onChange={set('city')} /></div>
            <div className="field"><label>País</label><input value={f.country} onChange={set('country')} /></div>
          </div>
          <button type="button" className="btn btn-ghost btn-sm" style={{ marginBottom:12 }} onClick={locate}>{f.lat ? '📍 Ubicación guardada · actualizar' : '📍 Detectar mi ubicación'}</button>
          <div className="field"><label>Foto de perfil (enlace)</label><input value={f.avatar_url} onChange={set('avatar_url')} placeholder="https://drive.google.com/file/d/…" /></div>
          <div className="field"><label>Perfil de Strava (enlace)</label><input value={f.strava_url} onChange={set('strava_url')} placeholder="https://www.strava.com/athletes/…" /></div>
          <button className="btn btn-lime" style={{ width:'100%' }} disabled={busy}>{busy ? 'Guardando…' : 'Guardar'}</button>
        </form>
      </div>
    </div>
  );
}

/* ---------- perfil (propio o de otro usuario) ---------- */
function ProfilePage({ userId, me, reloadMe, onProfile, toast }){
  const own = userId === me.id;
  const [p, setP] = useState(null);
  const [posts, setPosts] = useState([]);
  const [cnt, setCnt] = useState({ followers:0, following:0 });
  const [isFollowing, setIsFollowing] = useState(false);
  const [edit, setEdit] = useState(false);
  const [creating, setCreating] = useState(false);
  const [openPost, setOpenPost] = useState(null);
  const [rk, setRk] = useState(0);   // refresca las gráficas al cambiar tiempos

  const load = useCallback(async () => {
    const [pr, po, f1, f2, fl] = await Promise.all([
      sb.from('profiles').select('*').eq('id', userId).maybeSingle(),
      sb.from('posts').select('*, author:profiles(id,full_name,username,avatar_url), post_likes(user_id), post_comments(id)').eq('user_id', userId).order('created_at', { ascending:false }),
      sb.from('follows').select('*', { count:'exact', head:true }).eq('following_id', userId),
      sb.from('follows').select('*', { count:'exact', head:true }).eq('follower_id', userId),
      own ? Promise.resolve({ data:[] }) : sb.from('follows').select('follower_id').eq('follower_id', me.id).eq('following_id', userId),
    ]);
    setP(pr.data); setPosts(po.data || []); setCnt({ followers:f1.count || 0, following:f2.count || 0 }); setIsFollowing((fl.data || []).length > 0);
  }, [userId, me.id]);
  useEffect(() => { setP(null); load(); }, [load]);

  const toggleFollow = async () => {
    const { error } = isFollowing
      ? await sb.from('follows').delete().eq('follower_id', me.id).eq('following_id', userId)
      : await sb.from('follows').insert({ follower_id:me.id, following_id:userId });
    if (error) return toast('No se pudo actualizar');
    load();
  };

  if (!p) return <div className="container panel"><div className="empty"><div className="spinner" style={{ margin:'0 auto' }} /></div></div>;
  return (
    <div className="container panel" style={{ maxWidth:760 }}>
      <div className="pcard">
        <div className="profile-head">
          <Avatar p={p} size={92} />
          <div style={{ flex:1, minWidth:200 }}>
            <h2 className="display" style={{ fontSize:38 }}>{p.full_name}</h2>
            <p style={{ color:'var(--muted)', fontSize:14, margin:'4px 0 8px' }}>{p.username ? '@' + p.username : ''}{p.city ? ' · 📍 ' + p.city : ''}{own && me.email ? ' · ✉️ ' + me.email : ''}</p>
            <span className={`role-pill ${p.role}`}>{p.role}</span>
          </div>
          {own ? <button className="btn btn-ghost btn-sm" onClick={() => setEdit(true)}>{t('prof.edit', 'Editar perfil')}</button>
               : <button className={`btn btn-sm ${isFollowing ? 'btn-ghost' : 'btn-lime'}`} onClick={toggleFollow}>{isFollowing ? t('prof.following', 'Siguiendo') : t('prof.follow', 'Seguir')}</button>}
        </div>
        {p.bio && <p style={{ marginTop:16, lineHeight:1.6, fontSize:14 }}>{p.bio}</p>}
        {p.strava_url && <a className="link" style={{ display:'inline-block', marginTop:8 }} href={p.strava_url} target="_blank" rel="noopener noreferrer">Ver en Strava ↗</a>}
        <div className="p-stats"><div><b>{posts.length}</b><small>{t('prof.posts', 'publicaciones')}</small></div><div><b>{cnt.followers}</b><small>{t('prof.followers', 'seguidores')}</small></div><div><b>{cnt.following}</b><small>{t('prof.followingn', 'siguiendo')}</small></div></div>
        {own && <button className="btn btn-lime btn-sm" onClick={() => setCreating(true)}>＋ Nueva publicación</button>}

        {posts.length === 0 ? <div className="empty">{own ? 'Comparte tu primera foto o video de carrera.' : 'Sin publicaciones todavía.'}</div> :
          <div className="grid3">{posts.map(x => {
            const m = mediaInfo(x.media_url, x.media_type);
            return <div key={x.id} className="cell" onClick={() => setOpenPost(x)}
              style={m.kind === 'image' ? { backgroundImage:`url(${m.src})` } : undefined}>{m.kind !== 'image' && '🎬'}{x.media_type === 'video' && m.kind === 'image' && <span className="vid">▶</span>}</div>;
          })}</div>}
      </div>

      {own && <ConnectionsPanel p={p} me={me} toast={toast} onChanged={() => { load(); reloadMe(); setRk(k => k + 1); }} />}
      <ActivitiesPanel userId={userId} own={own} p={p} refreshKey={rk} toast={toast} />
      <StatsPanel userId={userId} refreshKey={rk} />
      <RecordsPanel userId={userId} own={own} toast={toast} defaultCity={p.city} onChanged={() => setRk(k => k + 1)} />

      {edit && <ProfileEditor p={p} onClose={() => setEdit(false)} onSaved={() => { load(); reloadMe(); }} toast={toast} />}
      {creating && <NewPostModal me={me} onClose={() => setCreating(false)} onDone={load} toast={toast} />}
      {openPost && <div className="overlay" onMouseDown={e => e.target === e.currentTarget && setOpenPost(null)}><div className="modal" style={{ padding:0, maxWidth:520, background:'transparent', border:'none' }}>
        <PostCard post={posts.find(x => x.id === openPost.id) || openPost} me={me} onProfile={() => setOpenPost(null)} toast={toast}
          onChange={np => setPosts(ps => ps.map(x => x.id === np.id ? np : x))}
          onDelete={async x => { if (!window.confirm('¿Eliminar esta publicación?')) return; await sb.from('posts').delete().eq('id', x.id); setOpenPost(null); load(); }} />
      </div></div>}
    </div>
  );
}
function Soon({ k }){
  const [ico, t, d] = SOON[k];
  return <div className="container panel"><div className="pcard soon"><div className="ico">{ico}</div><h3 className="display">{t}</h3><p>{d}</p></div></div>;
}

/* =====================================================================
   VISTA ADMIN — solo accesible con  /#admin
   ===================================================================== */
function AdminView({ auth, toast }){
  const [f, setF] = useState({ email:'', pass:'' });
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const login = async e => {
    e.preventDefault(); setErr(''); setBusy(true);
    if (!CONFIGURED){ setErr('Configura Supabase primero.'); setBusy(false); return; }
    const { error } = await sb.auth.signInWithPassword({ email:f.email, password:f.pass });
    if (error) setErr('Credenciales inválidas.');
    setBusy(false);
  };
  const exit = () => { window.location.hash = ''; };
  const google = async () => {
    setErr('');
    if (!CONFIGURED) return setErr('Configura Supabase primero.');
    if (window.location.protocol === 'file:') return setErr('Google no funciona abriendo el archivo directo. Abre la página desde tu dominio.');
    try { sessionStorage.setItem(ADMIN_FLAG, '1'); } catch (e) {}
    const { error } = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: window.location.origin + window.location.pathname } });
    if (error){ setErr(error.message); try { sessionStorage.removeItem(ADMIN_FLAG); } catch (e) {} }
  };

  if (auth.loading || (auth.user && !auth.profile)) return <Splash />;

  if (!auth.user) return (
    <div className="center"><div className="modal" style={{ animation:'none' }}>
      <h2 className="display">Admin</h2><p className="sub">Acceso restringido.</p>
      {err && <div className="msg err">{err}</div>}
      <button type="button" className="btn btn-google" onClick={google}><GoogleIcon /> Entrar con Google</button>
      <div className="divider">o con correo y contraseña</div>
      <form onSubmit={login}>
        <div className="field"><label>Correo</label><input type="email" required value={f.email} onChange={e => setF({ ...f, email:e.target.value })} /></div>
        <div className="field"><label>Contraseña</label><input type="password" required value={f.pass} onChange={e => setF({ ...f, pass:e.target.value })} /></div>
        <button className="btn btn-lime" style={{ width:'100%' }} disabled={busy}>{busy ? 'Validando…' : 'Entrar'}</button>
      </form>
      <p style={{ textAlign:'center', marginTop:14 }}><button className="link" onClick={exit}>← Volver al sitio</button></p>
    </div></div>
  );

  if (auth.profile.role !== 'admin') return (
    <div className="center"><div className="modal" style={{ animation:'none', textAlign:'center' }}>
      <h2 className="display">Sin acceso</h2><p className="sub">Esta cuenta no tiene permisos de administrador.</p>
      <button className="btn btn-ghost" onClick={signOut}>Cerrar sesión</button>{' '}
      <button className="btn btn-lime" onClick={exit}>Volver</button>
    </div></div>
  );

  return (<>
    <nav className="nav"><div className="container nav-in">
      <div className="logo"><LogoMark />Admin <span>Hub</span></div>
      <div className="nav-actions"><button className="btn btn-ghost btn-sm" onClick={exit}>Ver sitio</button><button className="btn btn-ghost btn-sm" onClick={signOut}>{t('nav.logout', 'Salir')}</button></div>
    </div></nav>
    <AdminPanel me={auth.user} toast={toast} />
  </>);
}

/* =====================================================================
   APP
   ===================================================================== */
function App(){
  const hash = useHash();
  const auth = useAuth();
  const { news, demo } = useNews();
  const [tab, setTabRaw] = useState('home');
  const [viewUser, setViewUser] = useState(null);   // perfil de otro usuario abierto
  const [groupId, setGroupId] = useState(null);   // página pública de un grupo abierta
  const setTab = t => { setViewUser(null); setGroupId(null); setTabRaw(t); window.scrollTo(0, 0); };
  const openProfile = id => { setGroupId(null); setViewUser(id); window.scrollTo(0, 0); };
  const openGroup = id => { setViewUser(null); setGroupId(id); window.scrollTo(0, 0); };
  const [authOpen, setAuthOpen] = useState(null);   // { role, mode }
  const [article, setArticle] = useState(null);
  const [toastMsg, toast] = useToast();
  const [lang, setLang] = useState(CUR_LANG);
  const changeLang = l => {
    CUR_LANG = l; document.documentElement.lang = LANGS[l].loc;
    try { localStorage.setItem('rh_lang', l); } catch (e) {}
    setLang(l);
  };
  const [cart, setCart] = useState({});             // carrito en memoria (nada se guarda en el index)
  const [cartOpen, setCartOpen] = useState(false);
  const nt = useNotifications(auth.user);
  const cartCount = Object.values(cart).reduce((s, x) => s + x.qty, 0);

  useEffect(() => { if (auth.user) setAuthOpen(null); }, [auth.user]);
  useEffect(() => {   // con la app abierta pero en segundo plano, el service worker pide que suene la alarma fuerte
    const sw = navigator.serviceWorker;
    if (!sw || !sw.addEventListener) return;
    const on = e => { if (e.data && e.data.type === 'push-sound') chime(); };
    sw.addEventListener('message', on);
    return () => sw.removeEventListener('message', on);
  }, []);
  useEffect(() => {   // enlace directo a un grupo: tu-sitio/#grupo=<id> (al tocar un aviso push del partner)
    const m = String(hash).match(/^#grupo=([0-9a-f-]{36})$/i);
    if (m){ setViewUser(null); setGroupId(m[1]); window.scrollTo(0, 0); }
  }, [hash]);
  useEffect(() => {   // el service worker es lo que despierta la app cuando llega un push con la app cerrada
    if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
  }, []);
  useEffect(() => {   // si ya dio permiso, deja registrado este dispositivo a nombre del usuario actual (teléfonos compartidos, claves renovadas)
    if (!auth.user || !PUSH_CONFIGURED || !pushSupported() || Notification.permission !== 'granted') return;
    pushSaveCurrent().catch(e => console.warn('push', e));
  }, [auth.user && auth.user.id]);
  useEffect(() => {   // volvió de Google habiendo empezado en /#admin → regresa al panel
    if (!auth.user) return;
    let go = false;
    try { go = sessionStorage.getItem(ADMIN_FLAG) === '1'; sessionStorage.removeItem(ADMIN_FLAG); } catch (e) {}
    if (go) window.location.hash = '#admin';
  }, [auth.user]);
  useEffect(() => { if (!auth.user) setCart({}); }, [auth.user]);
  useEffect(() => {   // errores devueltos por Supabase/Google en la URL (?error=…&error_description=…)
    const q = new URLSearchParams(window.location.search);
    const hq = new URLSearchParams(window.location.hash.replace(/^#\/?/, ''));
    const code = q.get('error_code') || hq.get('error_code');
    const desc = q.get('error_description') || hq.get('error_description');
    if (!q.get('error') && !hq.get('error') && !code) return;
    toast(code === 'bad_oauth_state'
      ? 'El inicio con Google expiró o se abrió desde otra dirección. Inténtalo de nuevo desde esta misma página.'
      : 'No se pudo iniciar sesión' + (desc ? ': ' + desc.replace(/\+/g, ' ') : ''));
    window.history.replaceState(null, '', window.location.pathname);
  }, []);
  useEffect(() => {   // regreso desde Strava: ?strava=connected|denied|scope|error
    const r = new URLSearchParams(window.location.search).get('strava');
    if (!r) return;
    const msg = { connected:'✅ Strava conectado. Estamos trayendo tus actividades…', denied:'Cancelaste la conexión con Strava.',
                  scope:'Debes aceptar el permiso «ver tus actividades» para conectar Strava.', error:'No se pudo conectar con Strava. Inténtalo de nuevo.' };
    const why = new URLSearchParams(window.location.search).get('why');
    toast((msg[r] || msg.error) + (r === 'error' && why ? ' Motivo: ' + why : ''));
    if (r === 'connected') setTabRaw('profile');
    window.history.replaceState(null, '', window.location.pathname + window.location.hash);
  }, []);
  useEffect(() => {   // regreso desde Mercado Pago: ?mp=success|pending|failure
    const r = new URLSearchParams(window.location.search).get('mp');
    if (!r) return;
    if (r === 'success'){ setCart({}); toast('🎉 ¡Pago recibido! Estamos confirmando tu pedido.'); }
    else if (r === 'pending') toast('⏳ Tu pago está pendiente de confirmación.');
    else toast('El pago no se completó. Puedes intentarlo de nuevo.');
    window.history.replaceState(null, '', window.location.pathname + window.location.hash);
  }, []);
  useEffect(() => { if (!nt.incoming) return; chime(); if (nt.incoming.kind === 'push') toast('🔔 ' + nt.incoming.title); }, [nt.incoming]);

  if (hash === '#admin') return <>{<AdminView auth={auth} toast={toast} />}{toastMsg && <div className="toast">{toastMsg}</div>}</>;

  const role = auth.profile?.role === 'partner' ? 'partner' : 'runner';
  const openAuth = (r = 'runner', m = 'signup') => setAuthOpen({ role:r, mode:m });

  if (auth.loading) return <Splash />;

  return (<>
    {!CONFIGURED && <div className="setup">⚙️ Modo vista previa: pega tu URL y anon key de Supabase al inicio del script para activar registro e inicio de sesión.</div>}
    <nav className="nav"><div className="container nav-in">
      <a className="logo" href="#" onClick={() => setTab('home')}><LogoMark />Runners <span>Hub</span></a>
      {auth.user && <div className="tabs hide-m">{TABS[role].map(([k, l]) => <button key={k} className={`tab ${tab === k ? 'on' : ''}`} onClick={() => setTab(k)}>{t('tab.' + k, l)}</button>)}</div>}
      <div className="nav-actions">
        <LangMenu lang={lang} onChange={changeLang} />
        {auth.user ? <>
          <span className="nav-name">{auth.profile?.full_name}</span>
          <button className="cart-btn" aria-label="Carrito" onClick={() => { setTab('store'); setCartOpen(true); }}>🛒{cartCount > 0 && <span className="cbadge">{cartCount}</span>}</button>
          <NotifBell nt={nt} toast={toast} />
          <a href="#" className="nav-avatar" onClick={e => { e.preventDefault(); setTab('profile'); }}><Avatar p={auth.profile || { full_name:auth.user.email }} /></a>
          <button className="btn btn-ghost btn-sm" onClick={signOut}>{t('nav.logout', 'Salir')}</button>
        </> : <>
          <button className="btn btn-ghost btn-sm" onClick={() => openAuth('runner', 'login')}>{t('nav.login', 'Entrar')}</button>
          <button className="btn btn-lime btn-sm hide-m" onClick={() => openAuth('runner')}>🏃 {t('nav.runner', 'Runner')}</button>
          <button className="btn btn-orange btn-sm hide-m" onClick={() => openAuth('partner')}>🤝 {t('nav.partner', 'Partner')}</button>
        </>}
      </div>
    </div>
    </nav>
    {auth.user && <div className="container show-m" style={{ paddingTop:10 }}><div className="tabs">
      {TABS[role].map(([k, l]) => <button key={k} className={`tab ${tab === k ? 'on' : ''}`} onClick={() => setTab(k)}>{t('tab.' + k, l)}</button>)}
    </div></div>}

    {auth.user && <PushBanner toast={toast} />}
    {groupId && <GroupPage key={groupId} groupId={groupId} me={auth.user} profile={auth.profile} openAuth={openAuth} onBack={() => auth.user ? setTab('groups') : setTab('home')}
        onProfile={openProfile} onManage={() => setTab('mygroup')} toast={toast} />}
    {!groupId && (!auth.user || (tab === 'home' && !viewUser)) && <Landing news={news} demo={demo} user={auth.user} openAuth={openAuth} openNews={setArticle} openGroup={openGroup} />}
    {!groupId && auth.user && viewUser && <ProfilePage key={viewUser} userId={viewUser} me={auth.user} reloadMe={auth.reload} onProfile={openProfile} toast={toast} />}
    {!groupId && auth.user && !viewUser && tab === 'feed' && <Feed me={auth.user} onProfile={openProfile} toast={toast} />}
    {!groupId && auth.user && !viewUser && tab === 'store' && <Store me={auth.user} profile={auth.profile} cart={cart} setCart={setCart} cartOpen={cartOpen} setCartOpen={setCartOpen} toast={toast} />}
    {!groupId && auth.user && !viewUser && tab === 'hyrox' && <HyroxTab me={auth.user} onProfile={openProfile} toast={toast} />}
    {!groupId && auth.user && !viewUser && tab === 'points' && <PointsTab me={auth.user} profile={auth.profile} toast={toast} />}
    {!groupId && auth.user && !viewUser && tab === 'activities' && <ActivitiesFeed onProfile={openProfile} />}
    {!groupId && auth.user && !viewUser && tab === 'ranking' && <Ranking me={auth.user} onProfile={openProfile} />}
    {!groupId && auth.user && !viewUser && tab === 'groups' && <GroupsTab profile={auth.profile} onOpen={openGroup} reloadMe={auth.reload} toast={toast} />}
    {!groupId && auth.user && !viewUser && tab === 'mygroup' && <MyGroup me={auth.user} profile={auth.profile} onView={openGroup} toast={toast} />}
    {!groupId && auth.user && !viewUser && tab === 'profile' && <ProfilePage key="me" userId={auth.user.id} me={auth.user} reloadMe={auth.reload} onProfile={openProfile} toast={toast} />}
    {!groupId && auth.user && !viewUser && SOON[tab] && <Soon k={tab} />}

    <footer className="footer"><div className="container"><LogoMark />© {new Date().getFullYear()} Runners Hub · {t('footer.tag', 'Hecho para quienes no se detienen.')}</div></footer>

    {authOpen && <AuthModal initialRole={authOpen.role} initialMode={authOpen.mode} onClose={() => setAuthOpen(null)} toast={toast} />}
    {article && <NewsModal n={article} onClose={() => setArticle(null)} />}
    {auth.user && <AdPopup nt={nt} />}
    {toastMsg && <div className="toast">{toastMsg}</div>}
  </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
