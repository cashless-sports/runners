function useNotifications(user){
  const [items, setItems] = useState([]);
  const [reads, setReads] = useState(new Set());
  const [incoming, setIncoming] = useState(null);

  const load = useCallback(async () => {
    const [n, r] = await Promise.all([
      sb.from('notifications').select('*').order('created_at', { ascending:false }).limit(30),
      sb.from('notification_reads').select('notification_id').eq('user_id', user.id),
    ]);
    setItems(n.data || []); setReads(new Set((r.data || []).map(x => x.notification_id)));
  }, [user?.id]);

  useEffect(() => {
    if (!user){ setItems([]); setReads(new Set()); return; }
    load();
    const ch = sb.channel('notifs-live').on('postgres_changes', { event:'INSERT', schema:'public', table:'notifications' }, payload => {
      const n = payload.new;
      setItems(x => [n, ...x]); setIncoming(n);   // con la app abierta: aviso dentro de la página (con la app cerrada lo muestra sw.js)
    }).subscribe();
    return () => { sb.removeChannel(ch); };
  }, [user?.id]);

  const markRead = async ids => {
    const fresh = ids.filter(id => !reads.has(id)); if (!fresh.length) return;
    setReads(new Set([...reads, ...fresh]));
    await sb.from('notification_reads').upsert(fresh.map(id => ({ notification_id:id, user_id:user.id })), { onConflict:'notification_id,user_id', ignoreDuplicates:true });
  };
  const unread = items.filter(i => !reads.has(i.id)).length;
  return { items, reads, unread, markRead, incoming };
}

/* ---------- notificaciones push: funcionan con la app CERRADA (service worker sw.js) ---------- */
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && window.isSecureContext;
const isIOSDevice = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const b64uToBytes = s => { const p = '='.repeat((4 - s.length % 4) % 4); const raw = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, c => c.charCodeAt(0)); };

async function pushRegistration(){
  let reg = await navigator.serviceWorker.getRegistration();
  if (!reg) reg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  return reg;
}
/* Suscribe este dispositivo (si hace falta) y guarda la suscripción en Supabase para el usuario actual */
async function pushSaveCurrent(){
  const reg = await pushRegistration();
  const key = b64uToBytes(VAPID_PUBLIC_KEY);
  let sub = await reg.pushManager.getSubscription();
  if (sub && sub.options && sub.options.applicationServerKey){          // ¿se creó con otra clave? hay que renovarla
    const cur = new Uint8Array(sub.options.applicationServerKey);
    if (cur.length !== key.length || cur.some((v, i) => v !== key[i])){ await sub.unsubscribe(); sub = null; }
  }
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:key });
  const j = sub.toJSON();
  const { error } = await sb.rpc('save_push_subscription', { p_endpoint:j.endpoint, p_keys:j.keys });
  if (error) throw error;
  return sub;
}
async function pushEnable(){
  const perm = await Notification.requestPermission();      // debe ocurrir por un toque del usuario
  if (perm !== 'granted') return perm;
  await pushSaveCurrent();
  return 'granted';
}
async function pushDisable(){
  const reg = await navigator.serviceWorker.getRegistration();
  const sub = reg && await reg.pushManager.getSubscription();
  if (sub){ const ep = sub.endpoint; await sub.unsubscribe(); await sb.rpc('delete_push_subscription', { p_endpoint:ep }); }
}
/* 'off' | 'on' | 'denied' | 'unsupported' | 'install' (iPhone: primero hay que instalar la app) */
async function pushStatus(){
  if (isIOSDevice() && !isStandalone()) return 'install';
  if (!pushSupported()) return 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  if (Notification.permission === 'granted'){
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    return sub ? 'on' : 'off';
  }
  return 'off';
}

/* Llama a la función send-push (envío de notificaciones). Lanza un Error con el mensaje del servidor. */
async function callSendPush(body){
  const { data, error } = await sb.functions.invoke('send-push', { body });
  if (error || (data && data.error)){
    let msg = (data && data.error) || 'No se pudo contactar con la función send-push (¿está desplegada?)';
    try { if (error && error.context && error.context.json) msg = (await error.context.json()).error || msg; } catch (x) {}
    throw new Error(msg);
  }
  return data;
}
/* Traduce los códigos de error del servicio de push a una causa que se pueda arreglar */
function pushHint(errors){
  const k = Object.keys(errors || {});
  if (!k.length) return '';
  if (k.includes('401') || k.includes('403')) return ' ⚠️ El servicio de push rechazó la firma: la clave VAPID pública de index.html no coincide con la privada guardada en Supabase, o VAPID_SUBJECT no es un correo con mailto:.';
  if (k.includes('400')) return ' ⚠️ El servicio de push rechazó el mensaje (400). Revisa que VAPID_SUBJECT sea mailto:tu@correo.com.';
  if (k.includes('429')) return ' ⚠️ Límite de envíos del servicio de push: reintenta en unos minutos.';
  if (k.includes('red')) return ' ⚠️ No se pudo conectar con el servicio de push.';
  return ' ⚠️ Errores del servicio de push: ' + k.map(c => c + '×' + errors[c]).join(', ');
}
/* Sonido y vibración cuando llega un aviso con la app ABIERTA (con la app cerrada suena el propio teléfono) */
let LAST_CHIME = 0;
function chime(force){
  const now = Date.now();
  if (!force && now - LAST_CHIME < 3500) return;            // evita que suene dos veces (aviso en vivo + aviso del service worker)
  try {
    if (!force && localStorage.getItem('rh_mute') === '1') return;
    LAST_CHIME = now;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx){
      // Alarma ascendente de 5 tonos, a volumen alto: dos ondas superpuestas (triangular + cuadrada) para que se oiga bien
      const ctx = new Ctx(); if (ctx.resume) ctx.resume();
      const t0 = ctx.currentTime;
      const master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      [[988, 0], [1319, 0.2], [988, 0.4], [1319, 0.6], [1568, 0.8]].forEach(([f, d]) => {
        [['triangle', 0.9], ['square', 0.25]].forEach(([type, peak]) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = type; o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(peak, t0 + d + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + (d === 0.8 ? 0.7 : 0.19));
          o.connect(g); g.connect(master); o.start(t0 + d); o.stop(t0 + d + (d === 0.8 ? 0.75 : 0.22));
        });
      });
      setTimeout(() => { try { ctx.close(); } catch (e) {} }, 2200);
    }
    if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 600]);
  } catch (e) {}
}

function PushToggle({ toast }){
  const [st, setSt] = useState(null);
  const [busy, setBusy] = useState(false);
  const refresh = useCallback(() => pushStatus().then(setSt).catch(() => setSt('unsupported')), []);
  useEffect(() => { if (PUSH_CONFIGURED) refresh(); }, []);
  if (!PUSH_CONFIGURED || st === null) return null;
  const enable = async () => {
    setBusy(true);
    try { const r = await pushEnable(); if (r === 'granted') toast(t('push.done', '🔔 ¡Listo! Recibirás avisos aunque la app esté cerrada.')); }
    catch (e) { console.warn(e); toast(t('push.err', 'No se pudo activar. Inténtalo de nuevo.')); }
    setBusy(false); refresh();
  };
  const disable = async () => { setBusy(true); try { await pushDisable(); } catch (e) { console.warn(e); } setBusy(false); refresh(); };
  if (st === 'on') return <div className="push-row"><span>{t('push.on', '✅ Notificaciones activas en este dispositivo')}</span><button className="link" disabled={busy} onClick={disable}>{t('push.disable', 'Desactivar')}</button></div>;
  if (st === 'off') return <button className="btn btn-lime btn-sm" style={{ width:'100%' }} disabled={busy} onClick={enable}>{busy ? '…' : t('push.enable', '🔔 Activar notificaciones')}</button>;
  return <div className="push-row"><span>{st === 'denied' ? t('push.denied', 'Bloqueaste las notificaciones para este sitio. Actívalas en los ajustes de tu navegador.')
    : st === 'install' ? t('push.ios', 'En iPhone/iPad: toca Compartir → «Añadir a pantalla de inicio» y abre la app desde ahí para poder activar las notificaciones.')
    : t('push.unsupported', 'Este navegador no admite notificaciones push.')}</span></div>;
}

  const [st, setSt] = useState(null);

function money(v, cur){
  try { return new Intl.NumberFormat(LOC(), { style:'currency', currency:cur || 'USD', maximumFractionDigits:2 }).format(v); }
  catch (e) { return (cur || '') + ' ' + v; }
}

function CheckoutModal({ cart, profile, onClose, toast }){
  const [f, setF] = useState({ name:profile?.full_name || '', phone:profile?.phone || '', address:'', city:profile?.city || '', notes:'' });

}

function AdminNotifs({ me, toast }){
  const [f, setF] = useState({ kind:'push', title:'', body:'', image_url:'', link_url:'' });
  const [rows, setRows] = useState(null);
  const [busy, setBusy] = useState(false);
  const set = k => e => setF({ ...f, [k]: e.target.value });
  const load = useCallback(async () => { const { data } = await sb.from('notifications').select('*').is('group_id', null).order('created_at', { ascending:false }).limit(50); setRows(data || []); }, []);
  useEffect(() => { load(); }, [load]);
  const [dev, setDev] = useState(null);           // { devices, users } · false = no disponible
  const pushCall = callSendPush;
  useEffect(() => { if (PUSH_CONFIGURED) pushCall({ action:'count' }).then(setDev).catch(() => setDev(false)); }, []);
  const send = async e => {
    e.preventDefault(); setBusy(true);
    const { data: row, error } = await sb.from('notifications').insert({ kind:f.kind, title:f.title.trim(), body:f.body.trim() || null, image_url:f.image_url.trim() || null, link_url:f.link_url.trim() || null, created_by:me.id }).select('id').single();
    if (error){ setBusy(false); return toast(error.message); }
    let extra = '';
    if (PUSH_CONFIGURED){
      try { const r = await pushCall({ notification_id:row.id }); extra = r.total ? ` · push a ${r.sent} de ${r.total} dispositivos${r.failed ? ' (' + r.failed + ' con error)' : ''}${pushHint(r.errors)}` : ' · aún no hay dispositivos suscritos'; }
      catch (ex) { extra = ' · el push no se pudo enviar: ' + ex.message; }
    }
    setBusy(false);
    toast((f.kind === 'ad' ? 'Publicidad enviada 📣' : 'Notificación enviada 🔔') + extra); setF({ ...f, title:'', body:'', image_url:'', link_url:'' }); load();
  };
  const test = async () => {
    setBusy(true);
    try { const r = await pushCall({ test:true }); toast(r.total === 0 ? 'Este dispositivo no está suscrito: activa las notificaciones en la campana 🔔 y vuelve a probar' : `Prueba enviada a ${r.sent} de ${r.total} dispositivo(s). Cierra la app y espera unos segundos.${pushHint(r.errors)}`); }
    catch (ex) { toast(ex.message); }
    setBusy(false);
  };
  return (<>
    <form className="pcard" onSubmit={send} style={{ marginBottom:20 }}>
      <h3 className="display" style={{ fontSize:28, marginBottom:6 }}>Enviar a todos los usuarios</h3>
      <p className="sub">Llega dentro de la página a quien la tenga abierta y, como notificación push, a los dispositivos que la activaron <b>aunque la app esté cerrada</b>.{' '}
        {!PUSH_CONFIGURED ? <b style={{ color:'var(--orange)' }}>El push está sin configurar: falta la clave VAPID en index.html (mira tools/vapid-generator.html).</b>
          : dev ? <b style={{ color:'var(--lime)' }}>📱 {dev.devices} dispositivo(s) suscrito(s) · {dev.users} usuario(s)</b>
          : dev === false ? <b style={{ color:'var(--orange)' }}>No se pudo leer la función send-push (¿está desplegada?)</b> : null}</p>
      <div className="seg"><button type="button" className={f.kind === 'push' ? 'on' : ''} onClick={() => setF({ ...f, kind:'push' })}>🔔 Notificación push</button><button type="button" className={f.kind === 'ad' ? 'on' : ''} onClick={() => setF({ ...f, kind:'ad' })}>📣 Publicidad</button></div>
      <div className="field"><label>Título</label><input required maxLength={80} value={f.title} onChange={set('title')} /></div>
      <div className="field"><label>Mensaje</label><textarea rows="2" maxLength={200} value={f.body} onChange={set('body')} /></div>
      <div className="form-row"><div className="field"><label>Imagen (enlace, opcional)</label><input value={f.image_url} onChange={set('image_url')} /></div><div className="field"><label>Enlace de destino</label><input value={f.link_url} onChange={set('link_url')} /></div></div>
      <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
        <button className="btn btn-lime btn-sm" disabled={busy}>{busy ? 'Enviando…' : 'Enviar ahora'}</button>
        {PUSH_CONFIGURED && <button type="button" className="btn btn-ghost btn-sm" disabled={busy} onClick={test}>🧪 Probar en mi dispositivo</button>}
      </div>
    </form>
    <div className="pcard"><h3 className="display" style={{ fontSize:24, marginBottom:8 }}>Historial</h3>
      {rows === null ? <div className="spinner" /> : rows.length === 0 ? <div className="empty">Nada enviado todavía.</div> : rows.map(n => (
        <div className="adm-row" key={n.id}><div><b>{n.kind === 'ad' ? '📣 ' : '🔔 '}{n.title}</b><small>{fmtDT(n.created_at)}{n.body ? ' · ' + n.body : ''}</small></div><button className="link" style={{ color:'var(--danger)' }} onClick={() => confirmDel('notifications', n.id, load, toast)}>Borrar</button></div>))}</div>
  </>);
}

function AdminPoints({ toast }){
  const empty = { name:'', kind:'km_block', points:'10', unit_km:'5', min_km:'0', groups:['run'], cap:'', active:true };
  const [rules, setRules] = useState(null);
  const [f, setF] = useState(empty);
  const [editId, setEditId] = useState(null);
  const [ov, setOv] = useState(null);
  const [users, setUsers] = useState([]);
  const [adj, setAdj] = useState({ user:'', delta:'', reason:'' });
  const [busy, setBusy] = useState('');
  const set = k => e => setF({ ...f, [k]: e.target.value });
  const load = useCallback(async () => {
    const [r, o, u] = await Promise.all([
      sb.from('points_rules').select('*').order('created_at'),
      sb.rpc('admin_points_overview'),
      sb.from('profiles').select('id,full_name,city').order('full_name').limit(500),
    ]);
    setRules(r.data || []); setOv(o.data || []); setUsers(u.data || []);
  }, []);
  useEffect(() => { load(); }, [load]);

  const isAct = f.kind === 'km_block' || f.kind === 'activity';
  const toggleGroup = k => setF({ ...f, groups:f.groups.includes(k) ? f.groups.filter(x => x !== k) : [...f.groups, k] });
  const save = async e => {
    e.preventDefault();
    const sports = SPORT_GROUPS.filter(g => f.groups.includes(g.k)).flatMap(g => g.types);
    if (isAct && !sports.length) return toast('Elige al menos un deporte');
    const p = { name:f.name.trim(), kind:f.kind, points:parseInt(f.points) || 0, unit_km:f.kind === 'km_block' ? +f.unit_km : null,
      min_km:isAct ? +f.min_km || 0 : 0, sports:isAct ? sports : SPORT_GROUPS[0].types, max_points_per_day:f.cap ? parseInt(f.cap) : null, active:f.active };
    const { error } = editId ? await sb.from('points_rules').update(p).eq('id', editId) : await sb.from('points_rules').insert(p);
    if (error) return toast(error.message);
    toast(editId ? 'Regla actualizada' : 'Regla creada ⭐'); setF(empty); setEditId(null); load();
  };
  const edit = r => {
    setEditId(r.id);
    setF({ name:r.name, kind:r.kind, points:String(r.points), unit_km:r.unit_km ? String(+r.unit_km) : '5', min_km:String(+r.min_km || 0),
      groups:SPORT_GROUPS.filter(g => g.types.some(t => (r.sports || []).includes(t))).map(g => g.k), cap:r.max_points_per_day ? String(r.max_points_per_day) : '', active:r.active });
    window.scrollTo(0, 0);
  };
  const toggle = async r => { await sb.from('points_rules').update({ active:!r.active }).eq('id', r.id); load(); };

    if (!window.confirm('Se aplicarán las reglas activas a las actividades y registros HYROX que ya existen. Lo que ya dio puntos no se duplica. ¿Continuar?')) return;
    setBusy('recalc');
    const { data, error } = await sb.rpc('admin_recalculate_points');
    setBusy(''); error ? toast(error.message) : (toast(`Listo: ${data} movimientos de puntos nuevos`), load());
  };
  const adjust = async e => {
    e.preventDefault();
    const { error } = await sb.rpc('admin_adjust_points', { p_user:adj.user, p_delta:parseInt(adj.delta), p_reason:adj.reason });
    if (error) return toast(error.message);
    toast('Puntos ajustados'); setAdj({ user:'', delta:'', reason:'' }); load();
  };

  return (<>
    <form className="pcard" onSubmit={save} style={{ marginBottom:20 }}>

        <div className="field"><label>Tipo de regla</label><select value={f.kind} onChange={set('kind')}>{Object.entries(RULE_KIND).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></div>
      </div>
      <div className="form-row">
        <div className="field"><label>Puntos que se ganan</label><input type="number" min="0" required value={f.points} onChange={set('points')} /></div>
        {f.kind === 'km_block' && <div className="field"><label>Cada cuántos km (en UNA actividad)</label><input type="number" min="0.1" step="0.1" required value={f.unit_km} onChange={set('unit_km')} /></div>}
        {f.kind === 'activity' && <div className="field"><label>Km mínimos de la actividad</label><input type="number" min="0" step="0.1" value={f.min_km} onChange={set('min_km')} /></div>}
      </div>
      {isAct && <div className="field"><label>Deportes que cuentan</label><div className="chips-f" style={{ marginBottom:0 }}>{SPORT_GROUPS.map(g => <button type="button" key={g.k} className={f.groups.includes(g.k) ? 'on' : ''} onClick={() => toggleGroup(g.k)}>{g.label}</button>)}</div></div>}
      <div className="form-row">
        <div className="field"><label>Máximo de puntos por día (vacío = sin tope)</label><input type="number" min="1" value={f.cap} onChange={set('cap')} placeholder="100" /></div>
        <div className="field"><label>&nbsp;</label><label style={{ display:'flex', gap:8, alignItems:'center', fontSize:14, padding:'12px 0' }}><input type="checkbox" checked={f.active} onChange={e => setF({ ...f, active:e.target.checked })} /> Regla activa</label></div>

      <div className="insight" style={{ marginTop:0, marginBottom:14 }}>Vista previa: <b>{ruleText({ kind:f.kind, points:f.points || 0, unit_km:f.unit_km || 0, min_km:f.min_km || 0, sports:SPORT_GROUPS.filter(g => f.groups.includes(g.k)).flatMap(g => g.types), max_points_per_day:f.cap || null })}</b></div>

/* ---- admin: canjes de los usuarios ---- */
function AdminRedemptions({ toast }){
  const [rows, setRows] = useState(null);
  const [notes, setNotes] = useState({});
  const [filter, setFilter] = useState('pending');
  const load = useCallback(async () => {
    const { data } = await sb.from('redemptions').select('*, buyer:profiles(full_name)').order('created_at', { ascending:false }).limit(200);
    setRows(data || []);
  }, []);
  useEffect(() => { load(); }, [load]);
  const resolve = async (r, status) => {
    if (status === 'cancelled' && !window.confirm('Se devolverán los puntos al usuario y el stock al premio. ¿Cancelar el canje?')) return;
    const { error } = await sb.rpc('admin_resolve_redemption', { p_id:r.id, p_status:status, p_note:notes[r.id] || null });
    error ? toast(error.message) : (toast(status === 'fulfilled' ? 'Marcado como entregado ✅' : 'Canje cancelado y puntos devueltos'), load());
  };
  if (rows === null) return <div className="spinner" />;
  const list = rows.filter(r => filter === 'all' || r.status === filter);
  const ST = { pending:'⏳ Pendiente', fulfilled:'✅ Entregado', cancelled:'↩️ Cancelado' };
  return (<>
    <div className="pill-tabs" style={{ marginBottom:16, overflowX:'auto' }}>{[['pending', 'Pendientes'], ['fulfilled', 'Entregados'], ['cancelled', 'Cancelados'], ['all', 'Todos']].map(([k, l]) => <button key={k} className={filter === k ? 'on' : ''} style={{ whiteSpace:'nowrap' }} onClick={() => setFilter(k)}>{l}</button>)}</div>
    <div className="pcard">{list.length === 0 ? <div className="empty">No hay canjes en esta vista.</div> : list.map(r => (
      <div className="adm-row" key={r.id} style={{ alignItems:'flex-start' }}>
        <div style={{ minWidth:0, flex:1 }}>
          <b>{REWARD_KIND[r.reward_kind]?.[0]} {r.reward_name} · {r.points_spent} pts</b>
          <small>{r.buyer?.full_name || 'Usuario'} · {fmtDT(r.created_at)} · {ST[r.status]}</small>
          {r.reward_kind === 'accessory' && <small style={{ color:'#cfd2dc' }}>📍 {r.shipping?.name} · {r.shipping?.address}, {r.shipping?.city} · 📞 {r.shipping?.phone}{r.shipping?.notes ? ' · ' + r.shipping.notes : ''}</small>}
          {r.admin_note && <small style={{ color:'var(--lime)' }}>💬 {r.admin_note}</small>}
          {r.status === 'pending' && <input className="comment-form" style={{ width:'100%', marginTop:8, background:'var(--bg2)', border:'1px solid var(--line)', borderRadius:10, padding:'8px 12px', color:'var(--text)', fontSize:13 }} placeholder="Nota para el usuario (ej. código del beneficio, guía de envío)" value={notes[r.id] || ''} onChange={e => setNotes({ ...notes, [r.id]:e.target.value })} />}
        </div>
        {r.status === 'pending' && <div style={{ display:'flex', flexDirection:'column', gap:8, flex:'none' }}><button className="btn btn-lime btn-sm" onClick={() => resolve(r, 'fulfilled')}>Entregado</button><button className="btn btn-ghost btn-sm" onClick={() => resolve(r, 'cancelled')}>Cancelar</button></div>}
      </div>))}</div>
  </>);
}

if (window.Chart){
  Chart.defaults.color = '#8b90a0';
  Chart.defaults.borderColor = '#242838';
  Chart.defaults.font.family = "'Inter',system-ui,sans-serif";
}
const PALETTE = ['#c6ff3d','#ff5a1f','#3da5ff','#b980ff','#ffd54a','#2fd6a3','#ff6fa8','#8b90a0'];

function ChartCanvas({ type, data, options }){
  const ref = useRef(); const chart = useRef();
  useEffect(() => {
    if (!window.Chart) return;
    chart.current?.destroy();
    chart.current = new Chart(ref.current, { type, data, options:{ responsive:true, maintainAspectRatio:false, ...options } });
    return () => chart.current?.destroy();
  }, [JSON.stringify(data), type]);
  return <div className="chart-wrap"><canvas ref={ref} /></div>;
}

/* Estadísticas personales a partir de los tiempos del usuario */
function StatsPanel({ userId, refreshKey }){
  const [recs, setRecs] = useState(null);
  const [dist, setDist] = useState('5K');
  useEffect(() => {
    sb.from('records').select('*').eq('user_id', userId).order('activity_date').then(({ data }) => setRecs(data || []));
  }, [userId, refreshKey]);

  if (!recs || recs.length === 0) return null;

  const prog = recs.filter(r => r.distance_label === dist);
  const byMonth = {}; recs.forEach(r => { const k = r.activity_date.slice(0, 7); byMonth[k] = (byMonth[k] || 0) + Number(r.distance_km); });
  const months = Object.keys(byMonth).sort();
  const bySource = {}; recs.forEach(r => { bySource[r.source || 'manual'] = (bySource[r.source || 'manual'] || 0) + 1; });
  const byCity = {}; recs.forEach(r => { if (r.city) byCity[r.city] = (byCity[r.city] || 0) + Number(r.distance_km); });
  const cities = Object.entries(byCity).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const totalKm = recs.reduce((s, r) => s + Number(r.distance_km), 0);
  const labels = ['5K','10K','21K','42K'].filter(d => recs.some(r => r.distance_label === d));
  const best = labels.map(d => Math.min(...recs.filter(r => r.distance_label === d).map(r => r.time_seconds)));

  return (
    <div style={{ marginTop:22 }}>
      <div className="p-stats" style={{ justifyContent:'space-around', background:'var(--card)', border:'1px solid var(--line)', borderRadius:20, padding:18, margin:0 }}>
        <div><b>{recs.length}</b><small>actividades</small></div>
        <div><b>{totalKm.toFixed(1)}</b><small>km totales</small></div>
        {labels.map((d, i) => <div key={d}><b style={{ color:'var(--lime)' }}>{fmtTime(best[i])}</b><small>mejor {d}</small></div>)}
      </div>
      <div className="charts">
        <div className="chart-box">
          <h4>Evolución de tiempo <select value={dist} onChange={e => setDist(e.target.value)}>{['5K','10K','21K','42K'].map(d => <option key={d}>{d}</option>)}</select></h4>
          {prog.length < 2 ? <div className="empty" style={{ padding:'70px 10px' }}>Registra al menos 2 tiempos de {dist} para ver tu evolución.</div> :
            <ChartCanvas type="line" data={{ labels:prog.map(r => fmtDate(r.activity_date)), datasets:[{ label:dist, data:prog.map(r => r.time_seconds), borderColor:'#c6ff3d', backgroundColor:'rgba(198,255,61,.15)', fill:true, tension:.35, pointRadius:4, pointBackgroundColor:'#c6ff3d' }] }}
              options={{ plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:c => fmtTime(c.parsed.y) } } }, scales:{ y:{ reverse:true, ticks:{ callback:v => fmtTime(v) } } } }} />}
        </div>
        <div className="chart-box">
          <h4>Kilómetros por mes</h4>
          <ChartCanvas type="bar" data={{ labels:months, datasets:[{ data:months.map(m => +byMonth[m].toFixed(1)), backgroundColor:'#ff5a1f', borderRadius:6 }] }} options={{ plugins:{ legend:{ display:false } } }} />
        </div>
        <div className="chart-box">
          <h4>Actividades por app</h4>
          <ChartCanvas type="doughnut" data={{ labels:Object.keys(bySource), datasets:[{ data:Object.values(bySource), backgroundColor:PALETTE, borderWidth:0 }] }} options={{ plugins:{ legend:{ position:'right' } }, cutout:'62%' }} />
        </div>
        <div className="chart-box">
          <h4>Kilómetros por ciudad</h4>
          {cities.length === 0 ? <div className="empty" style={{ padding:'70px 10px' }}>Agrega la ciudad al registrar tus tiempos.</div> :
            <ChartCanvas type="bar" data={{ labels:cities.map(c => c[0]), datasets:[{ data:cities.map(c => +c[1].toFixed(1)), backgroundColor:'#3da5ff', borderRadius:6 }] }} options={{ indexAxis:'y', plugins:{ legend:{ display:false } } }} />}
        </div>
      </div>
    </div>
  );
}

/* ---------- ranking ---------- */
const MEDAL = { 1:'🥇', 2:'🥈', 3:'🥉' };
function Ranking({ me, onProfile }){
  const [dist, setDist] = useState('5K');
  const [rows, setRows] = useState(null);
  const [city, setCity] = useState('');
  const [comm, setComm] = useState(null);

  useEffect(() => {
    setRows(null);
    sb.from('ranking_best').select('*').eq('distance_label', dist).order('time_seconds').limit(100).then(({ data }) => setRows(data || []));
  }, [dist]);
  useEffect(() => {
    Promise.all([
      sb.from('records').select('city,distance_km').not('city', 'is', null).limit(3000),
      sb.from('profiles').select('city').not('city', 'is', null).limit(3000),
    ]).then(([r, p]) => {
      const km = {}, ru = {};
      (r.data || []).forEach(x => { const c = x.city.trim(); km[c] = (km[c] || 0) + Number(x.distance_km); });
      (p.data || []).forEach(x => { const c = x.city.trim(); ru[c] = (ru[c] || 0) + 1; });
      setComm({ km:Object.entries(km).sort((a, b) => b[1] - a[1]).slice(0, 8), ru:Object.entries(ru).sort((a, b) => b[1] - a[1]).slice(0, 8) });
    });
  }, []);

  const cityOf = r => r.profile_city || r.city || '';
  const cities = rows ? [...new Set(rows.map(cityOf).filter(Boolean))].sort() : [];
  const list = rows ? (city ? rows.filter(r => cityOf(r) === city).map((r, i) => ({ ...r, position:i + 1 })) : rows) : null;
  const top = list ? list.slice(0, 3) : [];
  const rest = list ? list.slice(3) : [];
  const podiumOrder = [top[1], top[0], top[2]].filter(Boolean);

  return (
    <div className="container panel" style={{ maxWidth:820 }}>
      <div className="sec-head"><h2 className="display">{t('rank.h2a', 'Ranking ')}<em>{t('rank.h2b', 'global')}</em></h2><p>{t('rank.sub', 'Se toma el mejor tiempo de cada runner por distancia.')}</p></div>
      <div className="feed-top">
        <div className="pill-tabs">{['5K','10K','21K','42K'].map(d => <button key={d} className={dist === d ? 'on' : ''} onClick={() => { setDist(d); setCity(''); }}>{d}</button>)}</div>
        <select value={city} onChange={e => setCity(e.target.value)} style={{ background:'var(--card)', color:'var(--text)', border:'1px solid var(--line)', borderRadius:99, padding:'9px 14px', fontSize:13 }}>
          <option value="">{t('rank.allcities', '🌎 Todas las ciudades')}</option>{cities.map(c => <option key={c}>{c}</option>)}
        </select>
      </div>

      {list === null ? <div className="empty"><div className="spinner" style={{ margin:'0 auto' }} /></div>
        : list.length === 0 ? <div className="pcard empty">Nadie ha registrado un tiempo de {dist}{city ? ' en ' + city : ''} todavía. ¡Sé el primero en el podio! 🏆</div>
        : <>
          <div className="podium">{podiumOrder.map(r => (
            <div key={r.user_id} className={`pod p${r.position}`} onClick={() => onProfile(r.user_id)}>
              <span className="medal">{MEDAL[r.position]}</span>
              <Avatar p={{ avatar_url:r.avatar_url, full_name:r.full_name }} size={52} />
              <b>{r.full_name}</b><small>{cityOf(r) || '—'}</small>
              <div className="t">{fmtTime(r.time_seconds)}</div>
              <small>{fmtPace(r.time_seconds, r.distance_km)}</small>
            </div>))}
          </div>
          {rest.length > 0 && <div className="pcard" style={{ padding:12 }}>{rest.map(r => (
            <div key={r.user_id} className={`rrow ${r.user_id === me.id ? 'me' : ''}`} onClick={() => onProfile(r.user_id)}>
              <div className="pos">{r.position}</div>
              <Avatar p={{ avatar_url:r.avatar_url, full_name:r.full_name }} size={38} />
              <div className="nm"><b>{r.full_name}{r.user_id === me.id ? ' (tú)' : ''}</b><small>{cityOf(r) || '—'} · {fmtDate(r.activity_date)} · {r.source}</small></div>
              <div className="tm">{fmtTime(r.time_seconds)}</div>
            </div>))}</div>}
        </>}

      {comm && (comm.km.length > 0 || comm.ru.length > 0) && <>
        <div className="sec-head" style={{ marginTop:46 }}><h2 className="display" style={{ fontSize:40 }}>La <em>comunidad</em> en datos</h2></div>
        <div className="charts">
          <div className="chart-box"><h4>Runners por ciudad</h4>
            <ChartCanvas type="bar" data={{ labels:comm.ru.map(x => x[0]), datasets:[{ data:comm.ru.map(x => x[1]), backgroundColor:'#c6ff3d', borderRadius:6 }] }} options={{ indexAxis:'y', plugins:{ legend:{ display:false } } }} /></div>
          <div className="chart-box"><h4>Kilómetros registrados por ciudad</h4>
            <ChartCanvas type="bar" data={{ labels:comm.km.map(x => x[0]), datasets:[{ data:comm.km.map(x => +x[1].toFixed(0)), backgroundColor:'#ff5a1f', borderRadius:6 }] }} options={{ indexAxis:'y', plugins:{ legend:{ display:false } } }} /></div>
        </div>
      </>}
    </div>
  );

   ACTIVIDADES: Strava, archivos GPX/TCX (Garmin y otros), rutas y estadísticas
   ===================================================================== */
const SPORT_ICON = { Run:'🏃', TrailRun:'⛰️', VirtualRun:'🏃', Walk:'🚶', Hike:'🥾', Ride:'🚴', VirtualRide:'🚴', MountainBikeRide:'🚵', GravelRide:'🚴', EBikeRide:'🚴', Swim:'🏊', Workout:'💪', Yoga:'🧘' };
const sportIcon = t => SPORT_ICON[t] || '🏅';
const RIDES = ['Ride', 'VirtualRide', 'MountainBikeRide', 'GravelRide', 'EBikeRide'];
const RUN_TYPES = ['Run', 'TrailRun', 'VirtualRun'];

/* ---- polilíneas (mismo formato que Strava/Google) ---- */
function decodePoly(str){
  const out = []; let i = 0, lat = 0, lng = 0;
  while (i < str.length){
    for (let axis = 0; axis < 2; axis++){
      let b, shift = 0, res = 0;
      do { b = str.charCodeAt(i++) - 63; res |= (b & 31) << shift; shift += 5; } while (b >= 32);
      const d = res & 1 ? ~(res >> 1) : res >> 1;
      if (axis === 0) lat += d; else lng += d;
    }
    out.push([lat / 1e5, lng / 1e5]);
  }
  return out;
}
const encNum = n => { let v = n < 0 ? ~(n << 1) : n << 1, s = ''; while (v >= 0x20){ s += String.fromCharCode((0x20 | (v & 0x1f)) + 63); v >>= 5; } return s + String.fromCharCode(v + 63); };
function encodePoly(pts){
  let pl = 0, pg = 0, s = '';
  for (const [a, b] of pts){ const la = Math.round(a * 1e5), lo = Math.round(b * 1e5); s += encNum(la - pl) + encNum(lo - pg); pl = la; pg = lo; }
  return s;
}
function haversine(a, b){
  const R = 6371000, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
/* Zona de privacidad: se recortan los primeros y últimos 200 m para no revelar dónde vive el atleta */
function privacyPoly(pts, cut = 200, max = 600){
  if (pts.length < 2) return null;
  const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + haversine(pts[i - 1], pts[i]));
  const total = cum[cum.length - 1];
  if (total < cut * 3) return null;
  const from = cum.findIndex(c => c >= cut);
  let to = cum.length - 1; while (to > 0 && total - cum[to] < cut) to--;
  let out = pts.slice(from, to + 1);
  if (out.length > max){ const step = out.length / max; out = Array.from({ length:max }, (_, i) => out[Math.floor(i * step)]); }
  return out.length > 1 ? encodePoly(out) : null;
}

/* ---- lectura de archivos GPX / TCX (Garmin Connect, Coros, Polar, Suunto, Apple…) ---- */
function parseActivityFile(text, fname){
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('El archivo no es un GPX/TCX válido.');
  const NS = (el, tag) => el.getElementsByTagNameNS('*', tag);
  const pts = []; let name = null, sport = null;
  if (NS(doc, 'TrainingCenterDatabase').length){
    sport = NS(doc, 'Activity')[0]?.getAttribute('Sport');
    for (const tp of NS(doc, 'Trackpoint')){
      const g = t => NS(tp, t)[0]?.textContent;
      pts.push({ lat:parseFloat(g('LatitudeDegrees')), lon:parseFloat(g('LongitudeDegrees')), ele:parseFloat(g('AltitudeMeters')),
        t:Date.parse(g('Time')), hr:parseFloat(NS(NS(tp, 'HeartRateBpm')[0] || tp, 'Value')[0]?.textContent) });
    }
  } else {
    const trk = NS(doc, 'trk')[0];
    name = (trk && NS(trk, 'name')[0]?.textContent) || null;
    sport = trk && NS(trk, 'type')[0]?.textContent;
    for (const tp of NS(doc, 'trkpt')){
      const g = t => NS(tp, t)[0]?.textContent;
      pts.push({ lat:parseFloat(tp.getAttribute('lat')), lon:parseFloat(tp.getAttribute('lon')), ele:parseFloat(g('ele')), t:Date.parse(g('time')), hr:parseFloat(g('hr')) });
    }
  }
  return { pts:pts.filter(p => !isNaN(p.lat) && !isNaN(p.lon)), name:name && name.trim(), sport };
}
function activityStats(pts){
  let dist = 0, moving = 0, gain = 0, hrSum = 0, hrN = 0, hrMax = 0;
  let ref = (pts.find(p => !isNaN(p.ele)) || {}).ele;
  const cum = [0];
  for (let i = 1; i < pts.length; i++){
    const d = haversine([pts[i - 1].lat, pts[i - 1].lon], [pts[i].lat, pts[i].lon]);
    const dt = (pts[i].t - pts[i - 1].t) / 1000;
    dist += d; cum.push(dist);
    if (dt > 0 && dt <= 30 && d / dt >= 0.3) moving += dt;
    const e = pts[i].ele;
    if (!isNaN(e) && ref !== undefined){ if (e > ref + 3){ gain += e - ref; ref = e; } else if (e < ref - 3) ref = e; }
    if (!isNaN(pts[i].hr)){ hrSum += pts[i].hr; hrN++; hrMax = Math.max(hrMax, pts[i].hr); }
  }
  const elapsed = (pts[pts.length - 1].t - pts[0].t) / 1000;
  return { dist, moving:moving || elapsed, elapsed, gain, avgHr:hrN ? hrSum / hrN : null, maxHr:hrN ? hrMax : null, cum };
}
/* mejor tiempo para una distancia dentro de la actividad (ventana deslizante) */
function bestEffort(pts, cum, target){
  let best = null, j = 0;
  for (let i = 0; i < pts.length; i++){
    if (j < i) j = i;
    while (j < pts.length && cum[j] - cum[i] < target) j++;
    if (j >= pts.length) break;
    const t = (pts[j].t - pts[i].t) / 1000;
    if (t > 0 && (best === null || t < best)) best = t;
  }
  return best;
}
function guessSport(sport, avgSpeed){
  const s = (sport || '').toLowerCase();
  if (/run/.test(s)) return /trail/.test(s) ? 'TrailRun' : 'Run';
  if (/bik|cycl|ride/.test(s)) return 'Ride';
  if (/swim/.test(s)) return 'Swim';
  if (/hik/.test(s)) return 'Hike';
  if (/walk/.test(s)) return 'Walk';
  return avgSpeed >= 5.5 ? 'Ride' : 'Run';
}
async function importActivityFile(file, userId){
  const { pts, name, sport } = parseActivityFile(await file.text(), file.name);
  if (pts.length < 10) throw new Error('El archivo no trae suficientes puntos de ruta.');
  if (pts.some(p => isNaN(p.t))) throw new Error('El archivo no incluye tiempos (necesito la hora de cada punto).');
  const st = activityStats(pts);
  if (st.dist < 100) throw new Error('La actividad es demasiado corta.');
  const type = guessSport(sport, st.dist / st.moving);
  const row = {
    user_id:userId, provider:'gpx', external_id:`gpx-${Math.floor(pts[0].t / 1000)}-${Math.round(st.dist)}`,
    name:name || file.name.replace(/\.\w+$/, ''), sport_type:type, start_date:new Date(pts[0].t).toISOString(),
    distance_m:+st.dist.toFixed(1), moving_time_s:Math.round(st.moving), elapsed_time_s:Math.round(st.elapsed),
    elevation_gain_m:+st.gain.toFixed(1), avg_speed_ms:+(st.dist / st.moving).toFixed(3),
    avg_heartrate:st.avgHr && +st.avgHr.toFixed(1), max_heartrate:st.maxHr, detailed:true,
    polyline:privacyPoly(pts.map(p => [p.lat, p.lon])),
  };
  const { data, error } = await sb.from('activities').upsert(row, { onConflict:'user_id,provider,external_id' }).select('id').single();
  if (error) throw error;
  let recs = 0;
  if (RUN_TYPES.includes(type)){   // mejores tiempos 5K/10K/21K/42K para el ranking
    const rows = [];
    for (const [label, km] of [['5K', 5], ['10K', 10], ['21K', 21.0975], ['42K', 42.195]]){
      if (st.dist < km * 1000) continue;
      const t = bestEffort(pts, st.cum, km * 1000);
      if (t) rows.push({ user_id:userId, activity_id:data.id, distance_label:label, distance_km:km, time_seconds:Math.round(t), activity_date:row.start_date.slice(0, 10), source:'garmin/gpx' });
    }
    if (rows.length){ await sb.from('records').upsert(rows, { onConflict:'activity_id,distance_label' }); recs = rows.length; }
  }
  return { name:row.name, km:st.dist / 1000, recs };
}

/* ---- piezas visuales ---- */
function RouteThumb({ poly, w = 240, h = 130, color = '#c6ff3d' }){
  const d = React.useMemo(() => {
    const pts = poly ? decodePoly(poly) : [];
    if (pts.length < 2) return null;
    const la = pts.map(p => p[0]), lo = pts.map(p => p[1]);
    const minLa = Math.min(...la), maxLa = Math.max(...la), minLo = Math.min(...lo), maxLo = Math.max(...lo);
    const k = Math.cos(((minLa + maxLa) / 2) * Math.PI / 180);
    const W = (maxLo - minLo) * k || 1e-6, H = (maxLa - minLa) || 1e-6;
    const s = Math.min((w - 24) / W, (h - 24) / H), ox = (w - W * s) / 2, oy = (h - H * s) / 2;
    return pts.map((p, i) => (i ? 'L' : 'M') + ((p[1] - minLo) * k * s + ox).toFixed(1) + ' ' + (h - ((p[0] - minLa) * s + oy)).toFixed(1)).join('');
  }, [poly]);
  if (!d) return <div className="route-empty">🗺️</div>;
  return <svg className="route-svg" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMidYMid meet"><path d={d} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" /></svg>;
}
const paceOrSpeed = a => {
  const km = a.distance_m / 1000, t = a.moving_time_s || a.elapsed_time_s;
  if (!km || !t) return '—';
  return RIDES.includes(a.sport_type) ? (km / (t / 3600)).toFixed(1) + ' km/h' : fmtPace(t, km);
};
const durText = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };

function ActivityCard({ a, author, onOpen, onAuthor, extra }){
  return (
    <article className={`act-card ${a.hidden ? 'is-hidden' : ''}`}>
      {author && <div className="act-author" onClick={() => onAuthor(author.id)}><Avatar p={author} size={26} /><b>{author.full_name}</b></div>}
      <div onClick={() => onOpen(a)}>
        <div className="act-route"><span className="sport">{sportIcon(a.sport_type)} {a.provider === 'strava' ? 'Strava' : a.provider === 'gpx' ? 'GPX' : 'Garmin'}</span><RouteThumb poly={a.polyline} color={RIDES.includes(a.sport_type) ? '#3da5ff' : '#c6ff3d'} /></div>
        <div className="act-body">
          <h4>{a.name || 'Actividad'}</h4><small>{fmtDT(a.start_date)}{a.hidden ? ' · 🙈 oculta' : ''}</small>
          <div className="act-stats">
            <div><b>{(a.distance_m / 1000).toFixed(2)}</b><span>km</span></div>
            <div><b>{durText(a.moving_time_s || a.elapsed_time_s)}</b><span>tiempo</span></div>
            <div><b>{paceOrSpeed(a).replace(' /km', '')}</b><span>{RIDES.includes(a.sport_type) ? '' : 'min/km'}</span></div>
          </div>
        </div>
      </div>
      {extra}
    </article>
  );
}

function ActivityModal({ a, author, onClose }){
  const ref = useRef();
  useEffect(() => {
    if (!window.L || !a.polyline || !ref.current) return;
    const pts = decodePoly(a.polyline);
    const map = L.map(ref.current, { scrollWheelZoom:false });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:18, attribution:'© OpenStreetMap' }).addTo(map);
    const line = L.polyline(pts, { color:'#ff5a1f', weight:5 }).addTo(map);
    L.circleMarker(pts[0], { radius:7, color:'#fff', weight:2, fillColor:'#c6ff3d', fillOpacity:1 }).addTo(map);
    L.circleMarker(pts[pts.length - 1], { radius:7, color:'#fff', weight:2, fillColor:'#ff4d5e', fillOpacity:1 }).addTo(map);
    map.fitBounds(line.getBounds(), { padding:[24, 24] });
    return () => map.remove();
  }, [a.id]);
  const km = a.distance_m / 1000;
  return (
    <div className="overlay" style={{ zIndex:110 }} onMouseDown={e => e.target === e.currentTarget && onClose()}>
      <div className="modal wide">
        <button className="x" onClick={onClose}>✕</button>
        <span className="tag running">{sportIcon(a.sport_type)} {a.sport_type}</span>
        <h2 className="display" style={{ fontSize:34, margin:'10px 0 2px' }}>{a.name || 'Actividad'}</h2>
        <p style={{ color:'var(--muted)', fontSize:13 }}>{author ? author.full_name + ' · ' : ''}{fmtDT(a.start_date)}</p>
        {a.polyline ? <div className="map-box" ref={ref} /> : <div className="map-box" style={{ display:'grid', placeItems:'center', color:'var(--muted)' }}>Sin ruta (o muy corta para publicarla)</div>}
        <div className="big-stats">
          <div><b>{km.toFixed(2)}</b><span>km</span></div>
          <div><b>{durText(a.moving_time_s)}</b><span>en movimiento</span></div>
          <div><b>{paceOrSpeed(a).replace(' /km', '')}</b><span>{RIDES.includes(a.sport_type) ? 'velocidad media' : 'min/km'}</span></div>
          <div><b>{Math.round(a.elevation_gain_m || 0)}</b><span>m desnivel +</span></div>
          {a.avg_heartrate && <div><b>{Math.round(a.avg_heartrate)}</b><span>FC media</span></div>}
          {a.max_heartrate && <div><b>{Math.round(a.max_heartrate)}</b><span>FC máx</span></div>}
          {a.calories && <div><b>{Math.round(a.calories)}</b><span>kcal</span></div>}
        </div>
        <p style={{ fontSize:12, color:'var(--muted)' }}>La ruta omite los primeros y últimos 200 m por privacidad.</p>
        {a.provider === 'strava' && a.activity_url && <a className="btn btn-strava btn-sm" style={{ marginTop:12 }} href={a.activity_url} target="_blank" rel="noopener noreferrer">Ver en Strava ↗</a>}
      </div>
    </div>
  );
}

/* ---- panel de actividades de un perfil ---- */
function ActivitiesPanel({ userId, own, p, refreshKey, toast }){
  const [acts, setActs] = useState(null);
  const [open, setOpen] = useState(null);
  const canSee = own || p.share_activities;
  const load = useCallback(async () => {
    const { data } = await sb.from('activities').select('*').eq('user_id', userId).order('start_date', { ascending:false }).limit(300);
    setActs(data || []);
  }, [userId]);
  useEffect(() => { if (canSee) load(); }, [load, canSee, refreshKey]);

  if (!canSee) return <div className="pcard empty" style={{ marginTop:22 }}>🔒 {p.full_name} no comparte sus actividades.</div>;
  if (acts === null) return <div className="pcard" style={{ marginTop:22 }}><div className="spinner" style={{ margin:'20px auto' }} /></div>;

  const toggleHidden = async a => { await sb.from('activities').update({ hidden:!a.hidden }).eq('id', a.id); load(); };
  const remove = async a => { if (!window.confirm('¿Eliminar esta actividad?')) return; const { error } = await sb.from('activities').delete().eq('id', a.id); error ? toast(error.message) : load(); };

  const shown = acts.filter(a => own || !a.hidden);
  const total = shown.reduce((s, a) => ({ km:s.km + a.distance_m / 1000, t:s.t + (a.moving_time_s || 0), up:s.up + Number(a.elevation_gain_m || 0) }), { km:0, t:0, up:0 });
  const weekKey = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x.toISOString().slice(0, 10); };
  const wk = {}; shown.forEach(a => { const k = weekKey(a.start_date); wk[k] = (wk[k] || 0) + a.distance_m / 1000; });
  const weeks = Object.keys(wk).sort().slice(-12);
  const bySport = {}; shown.forEach(a => { bySport[a.sport_type] = (bySport[a.sport_type] || 0) + 1; });
  const runs = shown.filter(a => RUN_TYPES.includes(a.sport_type) && a.distance_m >= 3000 && a.moving_time_s).slice().reverse().slice(-30);
  const hasStrava = shown.some(a => a.provider === 'strava');

  return (
    <div style={{ marginTop:22 }}>
      <div className="pcard">
        <h3 className="display" style={{ fontSize:32, marginBottom:14 }}>🗺️ Actividades y rutas</h3>
        {shown.length === 0 ? <div className="empty">{own ? 'Conecta Strava o importa un archivo GPX/TCX para ver tus rutas aquí.' : 'Sin actividades visibles.'}</div> : <>
          <div className="big-stats" style={{ marginTop:0 }}>
            <div><b>{shown.length}</b><span>actividades</span></div><div><b>{total.km.toFixed(0)}</b><span>km totales</span></div>
            <div><b>{Math.round(total.t / 3600)}</b><span>horas</span></div><div><b>{Math.round(total.up).toLocaleString(LOC())}</b><span>m desnivel +</span></div>
          </div>
          <div className="charts" style={{ marginTop:0, marginBottom:22 }}>
            <div className="chart-box"><h4>Kilómetros por semana</h4>
              <ChartCanvas type="bar" data={{ labels:weeks.map(w => fmtDate(w)), datasets:[{ data:weeks.map(w => +wk[w].toFixed(1)), backgroundColor:'#c6ff3d', borderRadius:6 }] }} options={{ plugins:{ legend:{ display:false } } }} /></div>
            <div className="chart-box"><h4>Deportes</h4>
              <ChartCanvas type="doughnut" data={{ labels:Object.keys(bySport), datasets:[{ data:Object.values(bySport), backgroundColor:PALETTE, borderWidth:0 }] }} options={{ plugins:{ legend:{ position:'right' } }, cutout:'62%' }} /></div>
            {runs.length >= 2 && <div className="chart-box"><h4>Ritmo en carreras (≥ 3 km)</h4>
              <ChartCanvas type="line" data={{ labels:runs.map(a => fmtDate(a.start_date)), datasets:[{ data:runs.map(a => Math.round(a.moving_time_s / (a.distance_m / 1000))), borderColor:'#ff5a1f', backgroundColor:'rgba(255,90,31,.15)', fill:true, tension:.35, pointRadius:3 }] }}
                options={{ plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:c => Math.floor(c.parsed.y / 60) + ':' + String(c.parsed.y % 60).padStart(2, '0') + ' /km' } } }, scales:{ y:{ reverse:true, ticks:{ callback:v => Math.floor(v / 60) + ':' + String(v % 60).padStart(2, '0') } } } }} /></div>}
          </div>
          <div className="act-grid">{shown.map(a => (
            <ActivityCard key={a.id} a={a} onOpen={setOpen} extra={own && (
              <div style={{ display:'flex', gap:14, padding:'0 14px 12px' }}>
                <button className="link" onClick={() => toggleHidden(a)}>{a.hidden ? 'Mostrar' : 'Ocultar'}</button>
                {a.provider === 'gpx' && <button className="link" style={{ color:'var(--danger)' }} onClick={() => remove(a)}>Eliminar</button>}
              </div>)} />))}</div>
          {hasStrava && <p style={{ marginTop:16, fontSize:12, color:'var(--muted)' }}>Datos de actividades de Strava · <a className="link" href="https://www.strava.com" target="_blank" rel="noopener noreferrer">Powered by Strava</a></p>}
        </>}
      </div>
      {open && <ActivityModal a={open} onClose={() => setOpen(null)} />}
    </div>
  );
}

/* ---- conexiones + consentimiento (solo en tu propio perfil) ---- */
function ConnectionsPanel({ p, me, onChanged, toast }){
  const [conn, setConn] = useState(undefined);       // undefined = cargando, null = no conectado
  const [stravaPublic, setStravaPublic] = useState(true);
  const [busy, setBusy] = useState('');
  const fileRef = useRef();

  const load = useCallback(async () => {
    const { data } = await sb.rpc('my_connections');
    setConn((data || []).find(x => x.provider === 'strava') || null);
    const r = await sb.rpc('strava_public_allowed'); setStravaPublic(r.data !== false);
  }, []);
  useEffect(() => { load(); }, [load]);

  const call = async (action, okMsg, extra = {}) => {
    setBusy(action);
    const { data, error } = await sb.functions.invoke('strava', { body:{ action, ...extra } });
    setBusy('');
    if (error || data?.error){
      let msg = data?.error || 'No se pudo completar la acción.';
      try { if (error?.context?.json) msg = (await error.context.json()).error || msg; } catch (x) {}
      return toast(msg);
    }
    if (action === 'url'){ window.location.href = data.url; return; }
    if (okMsg) toast(okMsg(data));
    load(); onChanged();
  };
  const share = async v => {
    const { error } = await sb.from('profiles').update({ share_activities:v }).eq('id', me.id);
    if (error) return toast(error.message);
    toast(v ? 'Ahora tus actividades son visibles para todos' : 'Tus actividades ya no son visibles para otros'); onChanged();
  };
  const disconnect = async () => {
    if (!window.confirm('Se desconectará Strava. Tus actividades y marcas que ya descargaste se CONSERVAN en tu perfil. ¿Continuar?')) return;
    call('disconnect', () => 'Strava desconectado. Tus actividades siguen guardadas en tu perfil.');
  };
  const eraseData = async () => {
    if (!window.confirm('Se borrarán de esta app TODAS las actividades y marcas que vinieron de Strava y se desconectará. Esto no se puede deshacer. ¿Seguro?')) return;
    call('disconnect', () => 'Datos de Strava eliminados', { deleteData:true });
  };
  const onFile = async e => {
    const files = [...e.target.files]; e.target.value = '';
    if (!files.length) return;
    setBusy('file'); let ok = 0;
    for (const f of files){
      try { const r = await importActivityFile(f, me.id); ok++; toast(`✅ ${r.name} · ${r.km.toFixed(1)} km${r.recs ? ` · ${r.recs} marca(s) para el ranking` : ''}`); }
      catch (ex){ toast('❌ ' + f.name + ': ' + (ex.message || 'no se pudo leer')); }
    }
    setBusy(''); if (ok) onChanged();
  };

  return (
    <div className="pcard" style={{ marginTop:22 }}>
      <h3 className="display" style={{ fontSize:32, marginBottom:6 }}>🔗 Conexiones</h3>
      <p className="sub" style={{ marginBottom:14 }}>Trae tus entrenamientos, tiempos y rutas automáticamente.</p>

      <div className="consent">
        <div className="conn-row" style={{ borderBottom:'none', padding:0 }}>
          <div style={{ flex:1, minWidth:220 }}><b>Mostrar mis actividades a todos</b>
            <small>Si lo activas, los demás verán el nombre, distancia, tiempo, ritmo, desnivel, frecuencia cardíaca y la ruta (sin los primeros y últimos 200 m) de tus actividades, y tus marcas entrarán al ranking. Puedes ocultar una actividad concreta o apagar esto cuando quieras. Desactivado, solo tú las ves.</small></div>
          <label className="switch"><input type="checkbox" checked={!!p.share_activities} onChange={e => share(e.target.checked)} /><span /></label>
        </div>

const SPORT_GROUPS = [
  { k:'run',  label:'Carrera',               types:['Run', 'TrailRun', 'VirtualRun'] },
  { k:'ride', label:'Ciclismo',              types:['Ride', 'VirtualRide', 'MountainBikeRide', 'GravelRide', 'EBikeRide'] },
  { k:'walk', label:'Caminata / senderismo', types:['Walk', 'Hike'] },
  { k:'swim', label:'Natación',              types:['Swim'] },
];
const rkLabel = k => t('pts.kind.' + k, REWARD_KIND[k][1]);
const RULE_KIND = { km_block:'Por bloque de km', activity:'Por actividad', hyrox_race:'Carrera HYROX oficial', hyrox_training:'Simulacro / entrenamiento HYROX' };
const REWARD_KIND = { benefit:['🎟️', 'Beneficio'], surprise:['🎁', 'Sorpresa'], accessory:['🧢', 'Accesorio'], other:['⭐', 'Otro'] };
const sportsLabel = arr => SPORT_GROUPS.filter(g => g.types.some(t => (arr || []).includes(t))).map(g => g.label).join(', ') || '—';
function ruleText(r){
  const cap = r.max_points_per_day ? ` · máx. ${r.max_points_per_day} pts por día` : '';
  const sp = ` (${sportsLabel(r.sports)})`;
  const mn = +r.min_km > 0 ? ` de ${+r.min_km}+ km` : '';
  if (r.kind === 'km_block') return `Cada ${+r.unit_km} km en una actividad${mn} → ${r.points} pts${sp}${cap}`;
  if (r.kind === 'activity') return `Cada actividad${mn} → ${r.points} pts${sp}${cap}`;
  if (r.kind === 'hyrox_race') return `Cada carrera HYROX oficial registrada → ${r.points} pts${cap}`;
  return `Cada simulacro o entrenamiento HYROX registrado → ${r.points} pts${cap}`;
}

const HY_STATIONS = [
  { k:'ski', name:'SkiErg', dist:'1000 m', icon:'🎿' }, { k:'push', name:'Sled Push', dist:'50 m', icon:'🛷' },
  { k:'pull', name:'Sled Pull', dist:'50 m', icon:'🪢' }, { k:'burpee', name:'Burpee Broad Jumps', dist:'80 m', icon:'🤸' },
  { k:'row', name:'Remo', dist:'1000 m', icon:'🚣' }, { k:'farmers', name:'Farmers Carry', dist:'200 m', icon:'🏋️' },
  { k:'lunges', name:'Sandbag Lunges', dist:'100 m', icon:'🎒' }, { k:'wall', name:'Wall Balls', dist:'100 reps', icon:'🏐' },
];
/* Columnas del reglamento oficial 26/27: Mujeres Open · Hombres Open / Mujeres Pro · Hombres Pro */
const HY_LOADS = {
  wo:{ label:'Mujeres Open',              push:'102 kg', pull:'78 kg',  farmers:'2 × 16 kg', lunges:'10 kg', wall:'4 kg' },
  mo:{ label:'Hombres Open / Mujeres Pro', push:'152 kg', pull:'103 kg', farmers:'2 × 24 kg', lunges:'20 kg', wall:'6 kg' },
  mp:{ label:'Hombres Pro',               push:'202 kg', pull:'153 kg', farmers:'2 × 32 kg', lunges:'30 kg', wall:'9 kg' },
};
const HY_DIV = { open:'Open', pro:'Pro', doubles:'Doubles', pro_doubles:'Pro Doubles', relay:'Relay', elite15:'Elite 15' };
const HY_GENDER = { M:'Hombres', F:'Mujeres', X:'Mixto' };
const HY_KIND = { race:['🏁', 'Carrera oficial'], simulation:['⏱️', 'Simulacro completo'], training:['💪', 'Entrenamiento / parcial'] };
const HY_AGES = ['16-24', '25-29', '30-34', '35-39', '40-44', '45-49', '50-54', '55-59', '60-64', '65-69', '70-74', '75-79', '80-84', '85-89'];
const isProDiv = d => ['pro', 'pro_doubles', 'elite15'].includes(d);
function hyLoadKey(division, gender){
  if (isProDiv(division)) return gender === 'F' ? 'mo' : 'mp';
  return gender === 'F' ? 'wo' : 'mo';
}
/* Referencias aproximadas (resultados públicos, división Open): niveles por tiempo total y parciales por estación */
const HY_LEVELS = {
  M:[[4500, 'Élite'], [5100, 'Avanzado'], [6000, 'Intermedio'], [Infinity, 'Principiante']],
  F:[[5040, 'Élite'], [5820, 'Avanzado'], [6840, 'Intermedio'], [Infinity, 'Principiante']],
};
const HY_BENCH = {
  M:{ int:[267, 221, 306, 319, 284, 130, 296, 421], adv:[260, 206, 277, 277, 273, 119, 264, 364] },
  F:{ int:[311, 222, 334, 410, 324, 145, 301, 411], adv:[300, 205, 299, 357, 311, 135, 270, 353] },
};
function hyLevel(sec, gender, division){
  if (division !== 'open') return null;
  return HY_LEVELS[gender === 'F' ? 'F' : 'M'].find(([lim]) => sec < lim)[1];
}
function parseTime(str){
  const m = String(str || '').trim().match(/^(?:(\d{1,2}):)?(\d{1,3}):(\d{2})$/);
  if (!m) return null;
  const h = m[1] ? +m[1] : 0, mi = +m[2], s = +m[3];
  return s > 59 ? null : h * 3600 + mi * 60 + s;
}
const sum = a => (a || []).reduce((s, x) => s + x, 0);
const hyKey = r => `${r.division}|${r.gender}`;
const hyName = k => { const [d, g] = k.split('|'); return `${HY_DIV[d]} · ${HY_GENDER[g]}`; };

function HyroxForm({ me, onSaved, toast }){
  const blank = () => ({ kind:'race', title:'', date:new Date().toISOString().slice(0, 10), city:'', division:'open', gender:'M', age:'', total:'', penalty:'', rox:'', hr:'', place:'', url:'', notes:'', pub:true,
                         runs:Array(8).fill(''), sts:Array(8).fill('') });
  const [f, setF] = useState(blank);
  const [split, setSplit] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const set = k => e => setF({ ...f, [k]: e.target.value });
  const setArr = (k, i) => e => { const a = [...f[k]]; a[i] = e.target.value; setF({ ...f, [k]: a }); };
  const loads = HY_LOADS[hyLoadKey(f.division, f.gender)];

  const submit = async e => {
    e.preventDefault(); setErr('');
    const runs = f.runs.map(parseTime), sts = f.sts.map(parseTime);
    const anySplit = [...f.runs, ...f.sts].some(x => x.trim());
    const fullSplit = runs.every(x => x !== null) && sts.every(x => x !== null);
    if (anySplit && !fullSplit) return setErr('Completa los 8 tiempos de carrera y los 8 de estaciones (formato mm:ss), o déjalos todos vacíos.');
    const pen = f.penalty.trim() ? parseTime(f.penalty) : 0, rox = f.rox.trim() ? parseTime(f.rox) : null;
    if (pen === null || (f.rox.trim() && rox === null)) return setErr('Revisa el formato de penalización y Roxzone (mm:ss).');
    let total = f.total.trim() ? parseTime(f.total) : null;
    if (f.total.trim() && total === null) return setErr('El tiempo total debe ser h:mm:ss (ej. 1:25:30).');
    if (total === null && fullSplit && rox !== null) total = sum(runs) + sum(sts) + rox + pen;
    if (total === null) return setErr('Escribe el tiempo total (h:mm:ss). Si llenaste todos los parciales, indica también el tiempo de Roxzone para calcularlo.');
    setBusy(true);
    const { error } = await sb.from('hyrox_results').insert({
      user_id:me.id, kind:f.kind, title:f.title.trim() || null, event_date:f.date, city:f.city.trim() || null,
      division:f.division, gender:f.gender, age_group:f.age || null, total_seconds:total,
      run_splits:fullSplit ? runs : null, station_splits:fullSplit ? sts : null, roxzone_seconds:rox, penalty_seconds:pen,
      avg_heartrate:f.hr ? parseInt(f.hr) : null, place_overall:f.place ? parseInt(f.place) : null,
      results_url:f.url.trim() || null, notes:f.notes.trim() || null, is_public:f.pub,
    });
    setBusy(false);
    if (error) return setErr(error.message);
    toast(`${HY_KIND[f.kind][0]} Registro guardado. ¡Revisa tus puntos!`); setF(blank()); setSplit(false); onSaved();
  };

  return (
    <form className="pcard" onSubmit={submit}>
      <h3 className="display" style={{ fontSize:30, marginBottom:12 }}>Registrar HYROX</h3>
      {err && <div className="msg err">{err}</div>}
      <div className="seg" style={{ gridTemplateColumns:'repeat(3,1fr)' }}>
        {Object.entries(HY_KIND).map(([k, v]) => <button key={k} type="button" className={f.kind === k ? 'on' : ''} onClick={() => setF({ ...f, kind:k })}>{v[0]} {v[1]}</button>)}
      </div>
      <div className="form-row">
        <div className="field"><label>{f.kind === 'race' ? 'Nombre del evento' : 'Nombre / descripción'}</label><input value={f.title} onChange={set('title')} placeholder={f.kind === 'race' ? 'HYROX Bogotá 2026' : 'Simulacro de 4 semanas'} /></div>
        <div className="field"><label>Fecha</label><input type="date" required value={f.date} max={new Date().toISOString().slice(0, 10)} onChange={set('date')} /></div>
      </div>
      <div className="form-row">
        <div className="field"><label>División</label><select value={f.division} onChange={set('division')}>{Object.entries(HY_DIV).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></div>
        <div className="field"><label>Categoría</label><select value={f.gender} onChange={set('gender')}>{Object.entries(HY_GENDER).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></div>
      </div>
      <div className="form-row">

function HyroxProgress({ me, refreshKey, onChanged, toast }){
  const [rows, setRows] = useState(null);
  const [focus, setFocus] = useState('');
  const load = useCallback(async () => {
    const { data } = await sb.from('hyrox_results').select('*').eq('user_id', me.id).order('event_date').order('created_at');
    setRows(data || []);
  }, [me.id]);
  useEffect(() => { load(); }, [load, refreshKey]);
  if (rows === null) return <div className="empty"><div className="spinner" style={{ margin:'0 auto' }} /></div>;
  if (rows.length === 0) return <div className="pcard empty">Aún no tienes registros HYROX. Ve a «Registrar» y guarda tu primera carrera o simulacro. 🏁</div>;

  const combos = [...new Set(rows.map(hyKey))];
  const key = combos.includes(focus) ? focus : hyKey(rows[rows.length - 1]);
  const [div, gen] = key.split('|');
  const mine = rows.filter(r => hyKey(r) === key);
  const tests = mine.filter(r => r.kind !== 'training');
  const races = mine.filter(r => r.kind === 'race');
  const best = tests.length ? tests.reduce((a, b) => (b.total_seconds < a.total_seconds ? b : a)) : null;
  const bestRace = races.length ? races.reduce((a, b) => (b.total_seconds < a.total_seconds ? b : a)) : null;
  const last = tests[tests.length - 1], prev = tests[tests.length - 2];
  const delta = last && prev ? last.total_seconds - prev.total_seconds : null;
  const withS = mine.filter(r => r.run_splits && r.station_splits);
  const ls = withS[withS.length - 1];
  const bench = HY_BENCH[gen === 'F' ? 'F' : 'M'];
  const daysSince = tests.length ? Math.floor((Date.now() - new Date(tests[tests.length - 1].event_date)) / 86400000) : null;

  let rox = 0, run = 0, work = 0, weak = [], fade = null;
  if (ls){
    run = sum(ls.run_splits); work = sum(ls.station_splits);
    rox = ls.roxzone_seconds ?? Math.max(ls.total_seconds - run - work - ls.penalty_seconds, 0);
    const a = (ls.run_splits[0] + ls.run_splits[1]) / 2, b = (ls.run_splits[5] + ls.run_splits[6] + ls.run_splits[7]) / 3;
    fade = (b / a - 1) * 100;
    if (div === 'open') weak = HY_STATIONS.map((s, i) => ({ s, ratio:ls.station_splits[i] / bench.adv[i], t:ls.station_splits[i], adv:bench.adv[i] })).sort((x, y) => y.ratio - x.ratio);
  }
  const toggle = async r => { await sb.from('hyrox_results').update({ is_public:!r.is_public }).eq('id', r.id); load(); };
  const del = async r => { if (!window.confirm('¿Eliminar este registro?')) return; const { error } = await sb.from('hyrox_results').delete().eq('id', r.id); error ? toast(error.message) : (load(), onChanged()); };

  return (<>
    {combos.length > 1 && <div className="field" style={{ maxWidth:280 }}><label>Ver progreso de</label><select value={key} onChange={e => setFocus(e.target.value)}>{combos.map(k => <option key={k} value={k}>{hyName(k)}</option>)}</select></div>}

    <div className="kpis">
      <div><small>Mejor tiempo</small><b>{best ? fmtTime(best.total_seconds) : '—'}</b><span>{best ? (HY_KIND[best.kind][1] + (hyLevel(best.total_seconds, gen, div) ? ' · ' : '')) : ''}{best && hyLevel(best.total_seconds, gen, div) && <span className={`level ${hyLevel(best.total_seconds, gen, div)}`}>{hyLevel(best.total_seconds, gen, div)}</span>}</span></div>
      <div><small>Mejor carrera oficial</small><b>{bestRace ? fmtTime(bestRace.total_seconds) : '—'}</b><span>{bestRace ? (bestRace.title || fmtDate(bestRace.event_date)) : 'Sin carreras aún'}</span></div>
      <div><small>Último vs anterior</small><b style={{ color:delta === null ? 'var(--muted)' : delta <= 0 ? 'var(--lime)' : 'var(--orange)' }}>{delta === null ? '—' : (delta <= 0 ? '−' : '+') + fmtTime(Math.abs(delta))}</b><span>{delta === null ? 'Necesitas 2 pruebas' : delta <= 0 ? '¡Mejoraste!' : 'Más lento'}</span></div>
      <div><small>Registros</small><b>{mine.length}</b><span>{races.length} carreras · {mine.length - races.length} pruebas</span></div>
    </div>

    <div className="insight" style={{ marginTop:0, marginBottom:18 }}>
      {daysSince === null ? 'Haz un simulacro para medir tu punto de partida.' : daysSince > 42
        ? <>⚠️ Hace <b>{daysSince} días</b> de tu último test completo. Se recomienda medirse cada <b>4–6 semanas</b>: programa un simulacro para ver tu evolución.</>
        : <>✅ Último test hace <b>{daysSince} días</b>. Buen ritmo de control: repite un simulacro completo cada 4–6 semanas y medios simulacros cada 2–3.</>}
    </div>

    <div className="charts" style={{ marginTop:0 }}>
      {tests.length >= 2 && <div className="chart-box"><h4>Evolución del tiempo total</h4>
        <ChartCanvas type="line" data={{ labels:tests.map(r => fmtDate(r.event_date)), datasets:[{ data:tests.map(r => r.total_seconds), borderColor:'#c6ff3d', backgroundColor:'rgba(198,255,61,.15)', fill:true, tension:.3, pointRadius:4 }] }}
          options={{ plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:c => fmtTime(c.parsed.y) } } }, scales:{ y:{ reverse:true, ticks:{ callback:v => fmtTime(v) } } } }} /></div>}
      {ls && <div className="chart-box"><h4>¿Dónde se va el tiempo? · {fmtDate(ls.event_date)}</h4>
        <ChartCanvas type="doughnut" data={{ labels:['Correr', 'Estaciones', 'Roxzone', 'Penalizaciones'], datasets:[{ data:[run, work, rox, ls.penalty_seconds], backgroundColor:['#c6ff3d', '#ff5a1f', '#3da5ff', '#ff4d5e'], borderWidth:0 }] }}
          options={{ plugins:{ legend:{ position:'right' }, tooltip:{ callbacks:{ label:c => c.label + ': ' + fmtTime(c.parsed) } } }, cutout:'58%' }} /></div>}
      {ls && <div className="chart-box"><h4>Tus estaciones{div === 'open' ? ' vs referencias' : ''}</h4>
        <ChartCanvas type="bar" data={{ labels:HY_STATIONS.map(s => s.name.replace('Burpee Broad Jumps', 'Burpees').replace('Sandbag Lunges', 'Lunges')),
          datasets:[{ label:'Tú', data:ls.station_splits, backgroundColor:'#c6ff3d', borderRadius:4 },
            ...(div === 'open' ? [{ label:'Intermedio', data:bench.int, backgroundColor:'rgba(61,165,255,.55)', borderRadius:4 }, { label:'Avanzado', data:bench.adv, backgroundColor:'rgba(255,90,31,.6)', borderRadius:4 }] : [])] }}
          options={{ plugins:{ tooltip:{ callbacks:{ label:c => c.dataset.label + ': ' + fmtTime(c.parsed.y) } } }, scales:{ y:{ ticks:{ callback:v => fmtTime(v) } } } }} /></div>}
      {ls && <div className="chart-box"><h4>Ritmo de cada 1 km</h4>
        <ChartCanvas type="line" data={{ labels:ls.run_splits.map((_, i) => 'Km ' + (i + 1)), datasets:[{ label:'Último', data:ls.run_splits, borderColor:'#ff5a1f', tension:.3, pointRadius:3 },
            ...(withS.length > 1 && best && best.run_splits && best.id !== ls.id ? [{ label:'Mejor', data:best.run_splits, borderColor:'#8b90a0', borderDash:[6, 4], tension:.3, pointRadius:2 }] : [])] }}
          options={{ plugins:{ tooltip:{ callbacks:{ label:c => c.dataset.label + ': ' + fmtTime(c.parsed.y) + ' /km' } } }, scales:{ y:{ reverse:true, ticks:{ callback:v => fmtTime(v) } } } }} /></div>}
    </div>

    {ls && <div className="pcard" style={{ marginTop:18 }}>
      <h3 className="display" style={{ fontSize:26, marginBottom:8 }}>🔎 Diagnóstico de tu último registro con parciales</h3>
      <div className="insight">Tiempo corriendo: <b>{fmtTime(run)}</b> ({Math.round(run / ls.total_seconds * 100)}%) · Estaciones: <b>{fmtTime(work)}</b> ({Math.round(work / ls.total_seconds * 100)}%) · Roxzone: <b>{fmtTime(rox)}</b> ({Math.round(rox / ls.total_seconds * 100)}%)</div>
      {fade !== null && <div className={`insight ${fade > 8 ? 'warn' : ''}`}>{fade > 8 ? '⚠️' : '✅'} Caída de ritmo: tus últimos 3 km fueron <b>{fade > 0 ? '+' : ''}{fade.toFixed(1)}%</b> {fade > 0 ? 'más lentos' : 'más rápidos'} que los 2 primeros. {fade > 8 ? 'Trabaja la resistencia y el ritmo de salida.' : 'Buena gestión del esfuerzo.'}</div>}
      {rox > 0 && <div className={`insight ${rox > 480 ? 'warn' : ''}`}>{rox > 480 ? '⚠️' : '✅'} Roxzone: los atletas de élite pasan unos 4–5 min y los intermedios 7–8:30. {rox > 480 ? 'Ahí hay tiempo fácil de ganar: entradas y salidas de estación más ágiles.' : 'Vas bien en las transiciones.'}</div>}
      {weak.length > 0 && <div className="insight warn">🎯 Estaciones a mejorar (más lejos del nivel Avanzado): {weak.slice(0, 3).map(w => `${w.s.name} (${fmtTime(w.t)} vs ${fmtTime(w.adv)})`).join(' · ')}. Tu punto fuerte: {weak[weak.length - 1].s.name}.</div>}
    </div>}

    <div className="pcard" style={{ marginTop:18 }}>
      <h3 className="display" style={{ fontSize:26, marginBottom:6 }}>Mis registros</h3>
      {[...rows].reverse().map(r => (
        <div className="adm-row" key={r.id}>
          <div style={{ minWidth:0 }}>
            <b>{HY_KIND[r.kind][0]} {fmtTime(r.total_seconds)} {hyLevel(r.total_seconds, r.gender, r.division) && <span className={`level ${hyLevel(r.total_seconds, r.gender, r.division)}`}>{hyLevel(r.total_seconds, r.gender, r.division)}</span>}</b>
            <small>{r.title || HY_KIND[r.kind][1]} · {fmtDate(r.event_date)} · {hyName(hyKey(r))}{r.age_group ? ' · ' + r.age_group : ''}{r.run_splits ? ' · con parciales' : ''}{r.penalty_seconds ? ' · +' + fmtTime(r.penalty_seconds) + ' pen.' : ''}</small>
          </div>
          <div style={{ display:'flex', gap:12, flex:'none' }}>
            <button className="link" onClick={() => toggle(r)}>{r.is_public ? '🌎 Público' : '🔒 Privado'}</button>
            {r.results_url && <a className="link" href={r.results_url} target="_blank" rel="noopener noreferrer">Oficial ↗</a>}
            <button className="link" style={{ color:'var(--danger)' }} onClick={() => del(r)}>Borrar</button>
          </div>
        </div>))}
    </div>
  </>);
}

function HyroxTab({ me, onProfile, toast }){
